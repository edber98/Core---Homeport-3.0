redis:
  image: redis:latest
  url: ""
  port: 6379
  persistence:
    storageClass: "longhorn"
    size: "1Gi"

replicaCount: 1

kinn:
  ingress:
    host: "${client.key}-kinn.app.kinn.fr"
    tlsSecret: kinn-c4rbon-io2
    enabled: true
  # Connexion MongoDB (URL + port séparés, format final = "url:port")
  mongodb:
    url: ""
    port: 27017
  kinnApi:
    replicaCount: 1
    port: 5055
    hmac_secret: 'dev-secret-change-me'
    # Clé de chiffrement AES des credentials (Credential.secret). OBLIGATOIRE en
    # prod : openssl rand -hex 32. Sans elle, impossible de déchiffrer/recréer.
    enc_key: 'dev-enc-key-change-me'
    token_ttl_sec: 86400
    seed: "true"
    plugin_import_enabled: 1
    # ── Radar d'entreprise ──
    # "0" désactive entièrement le Radar (menu masqué, routes 404, scheduler off).
    radar_enabled: "0"
    # Observation continue + superviseur proactif (opt-in, consomment des crédits IA).
    radar_scheduler_enabled: "0"
    radar_supervisor_enabled: "0"
    # Modèles dédiés (vides = filtre haiku, superviseur/mission = anthropic_model).
    radar_llm_model: ""
    radar_supervisor_model: ""
    radar_mission_model: ""
    # Supprime les plugins absents des manifests au boot (1 = actif)
    plugin_cleanup_enabled: 0
    plugin_repos: ""
    default_company: "ACME"
    default_admin_email: "admin@acme.test"
    default_admin_password: "admin"
    default_workspace_name: "Default"
    # Liste des companies à créer au seed, séparées par virgules.
    # Vide = par défaut = ${default_company}+BETA (multi-tenant historique).
    # En single-tenant SaaS, mets une seule entrée = ${client.name}.
    seed_companies: ""
    # Bind direct de la 1ère company seedée à un org Zitadel.
    # Évite le `db.companies.updateOne(...)` manuel après déploiement.
    # En SaaS, Kinn-panel pose cet ID au moment de la création de l'instance.
    seed_company_zitadel_org_id: ""
    # Crée les users démo (admin/alice/demo). En prod SaaS avec SSO, mets "0" :
    # le 1er admin sera auto-provisionné via JIT au 1er login Zitadel.
    seed_demo_users: "1"
    # Crée system@kinn.local + son service token au boot (plugin Kinn auto-référence).
    # Désactive (mets "0") si tu n'utilises pas le plugin Kinn local.
    local_service_token_enabled: "1"
    node_env: "production"
    # ── LLM provider ──
    ai_provider: "openai"           # "openai" | "anthropic"
    openai_api_key: ""
    openai_model: ""                # ex: "gpt-5.4" / "gpt-4o" / "gpt-4o-mini"
    anthropic_api_key: ""
    anthropic_model: ""             # ex: "claude-sonnet-4-5-20250929"
    mongo_db_name: "kinn-test"
    # ── Runtime container (gVisor / kata) ──
    # Vide = runc par défaut. Mettre "gvisor" si tu as installé runsc + RuntimeClass.
    runtimeClassName: ""
    # ── Sandbox d'exécution code IA (execute_code) ──
    # bwrap     : isolation Linux namespaces (besoin sysctl unprivileged_userns_clone=1)
    # subprocess: exécution directe — recommandé AVEC runtimeClassName=gvisor
    # none      : aucune isolation — DEV UNIQUEMENT
    # auto      : détection auto (bwrap si dispo, sinon subprocess)
    ai_sandbox_backend: "subprocess"
    ai_sandbox_python: "python3"
    ai_sandbox_py_site_packages: "/data/sandbox-pkgs"
    skills_bundle_dir: "/app/skills-bundle"
    # ── Tuning OpenAI (gpt-5.x) ──
    ai_reasoning_effort: "none"     # "none" | "low" | "medium" | "high" | "xhigh"
    ai_verbosity: "medium"          # "low" | "medium" | "high"
    ai_parallel_tool_calls: "0"     # "1" pour activer (défaut 0 = séquentiel)
    ai_max_tokens: "16384"
    ai_temperature: "0.7"
    ai_debug: "0"
    # ── IA LOCALE (vLLM / Ollama / LM Studio — endpoint OpenAI-compatible) ──
    # Renseigner ai_base_url bascule automatiquement AI_PROVIDER sur 'vllm'.
    ai_base_url: ""                 # ex: "http://vllm:8000/v1"
    vllm_base_url: ""               # alias de ai_base_url
    vllm_model: ""                  # ex: "Qwen/Qwen3-32B"
    ai_model_vllm: ""               # alias de vllm_model
    vllm_api_key: "local"
    vllm_max_tokens: "0"            # 0 = pas de plafond imposé
    ai_force_chat_completions: "0"  # 1 = forcer Chat Completions (sinon Responses API)
    # ── IA avancé (toggles agents/subagents) ──
    ai_default_max_loops: "100"
    ai_enable_thinking: "0"
    ai_disable_doc_writer: "0"
    ai_disable_memory_extractor: "0"
    ai_disable_subagent_async: "0"
    agent_use_queue: "0"            # 1 = file d'attente Redis pour les events agents
    ai_agent_worktree_mode: "shared"
    ai_model_limits: ""             # JSON override des limites de contexte par modèle
    subagent_deps_timeout_ms: "3600000"
    # ── Install de packages (sandbox code IA) ──
    ai_package_install_mode: "ask"  # "ask" | "auto" | "off"
    ai_package_install_max_per_day: "20"
    ai_package_whitelist: ""
    ai_package_blacklist: ""
    # ── LLM "mini" pour webscraping / extraction de pages ──
    # Vide = défaut auto (haiku si Anthropic, gpt-4o-mini si OpenAI)
    web_mini_provider: ""           # "openai" | "anthropic"
    web_mini_model: ""              # ex: "gpt-4o-mini" / "claude-haiku-4-5"
    web_mini_base_url: ""           # vide = hérite de ai_base_url
    web_mini_api_key: ""            # vide = hérite de vllm_api_key
    # ── Outils web de l'agent (web_search / web_fetch / browser) ──
    web_search_engine: "bing"
    web_search_fallback: "brave"
    web_search_timeout_ms: "40000"
    web_http_timeout_ms: "30000"
    web_browser_timeout_ms: "30000"
    web_fetch_max_bytes: "5242880"
    web_fetch_max_raw_chars: "80000"
    # ── Redis (events temps réel / queue agents — optionnel) ──
    # Vide = pas de Redis (fallback in-memory). Pour le service Redis du chart : "<release>-redis".
    redis_host: ""
    redis_port: "6379"
    redis_password: ""
    # ── Stockage de fichiers ──
    file_storage_type: "local"      # "local" | "s3"
    file_storage_path: "/data/files"
    file_max_size: "200mb"
    file_ttl_default: "24h"
    file_cleanup_interval: "1h"
    file_execution_cleanup_delay: "30m"
    file_s3_bucket: ""
    file_s3_region: "us-east-1"
    file_s3_access_key: ""
    file_s3_secret_key: ""
    file_s3_endpoint: ""
    # ── Timeouts streaming / subagents ──
    ai_stream_timeout_ms: "240000"           # 4 min
    ai_subagent_heartbeat_timeout_ms: "180000"  # 3 min
    ai_max_subagent_depth: "3"
    # ── URLs publiques (HTTP trigger persistent URL + SSO callback) ──
    # Si vides, calculées depuis kinn.ingress.host. À remplir si tu utilises
    # un domaine custom différent du ingress par défaut.
    kinn_public_url: ""        # ex: https://${client.key}-kinn.app.kinn.fr
    frontend_base_url: ""      # ex: https://${client.key}-kinn.app.kinn.fr
    # ── HTTP Trigger entrant ──
    http_trigger_rate_limit_per_min: "120"
    # ── SSO Zitadel (injecté par Kinn-panel à la création de l'instance) ──
    # sso_mode: 'disabled' | 'hybrid' | 'enforced'
    sso_mode: "disabled"
    zitadel_issuer: ""                    # ex: https://kinn-mgmt.zitadel.cloud
    zitadel_client_id: ""
    zitadel_client_secret: ""
    zitadel_project_id: ""
    zitadel_redirect_uri: ""              # ex: https://<host>/api/auth/sso/callback
    zitadel_post_logout_uri: ""           # ex: https://<host>/login
    # Secret HMAC partagé pour valider les webhooks /internal/* poussés par Kinn-panel
    kinn_panel_hmac_secret: ""
    # Mapping rôles Zitadel → Kinn. Vide = 1:1 (admin/editor/viewer en miroir).
    # Format : "zitadelRole:kinnRole,...". "*:role" = fallback.
    # Ex : "superadmin:admin,poweruser:editor,readonly:viewer,*:viewer"
    sso_role_map: ""
    # ── OAuth Bouncer (concentrateur auth.kinn.fr, injecté par Kinn-panel) ──
    # Clé HS256 PARTAGÉE avec le panel + toute la flotte. DOIT être identique
    # partout (sinon le panel ne peut pas vérifier les state JWT de l'instance).
    kinn_oauth_relay_secret: ""
    kinn_oauth_concentrator_url: "https://auth.kinn.fr"
    # Identifiants OAuth par vendor. Résolus côté panel : DB OAuthProvider > env.
    # Une seule app enregistrée par vendor (redirect = auth.kinn.fr/oauth/<vendor>/callback).
    google_oauth_client_id: ""
    google_oauth_client_secret: ""
    microsoft_oauth_client_id: ""
    microsoft_oauth_client_secret: ""
    meta_oauth_client_id: ""
    meta_oauth_client_secret: ""
    # TikTok utilise client_key (et non client_id).
    tiktok_oauth_client_key: ""
    tiktok_oauth_client_secret: ""
    # ── Système de crédits (Panel ↔ Kinn-app) ────────────────────────────────
    # Toutes ces clés sont injectées par le worker Kinn-panel au déploiement
    # selon Application.creditsEnabled. Si le toggle est OFF côté Panel,
    # `kinn_panel_credits_enabled` reste à "false" et le helper Kinn-app
    # passe en mode standalone (mocks no-op).
    #
    # Voir docs/credits-overview.md et docs/credits-setup-prod.md.
    kinn_panel_internal_url: "https://panel.kinn.fr"
    # URL publique du Panel (visible par l'utilisateur final) — affichée
    # dans le badge crédits frontend pour le lien "Voir détails dans le Panel".
    # Vide => le frontend retombe sur kinn_panel_internal_url.
    kinn_panel_public_url: ""
    kinn_panel_credits_enabled: "false"
    kinn_panel_app_id: ""        # ObjectId de l'Application côté Panel
    kinn_panel_client_id: ""     # ObjectId du ClientAccount côté Panel
    # Si "true", erreur réseau Panel → mock no-op (Kinn-app continue).
    # En prod recommandé "false" pour bloquer l'appel IA si Panel down.
    kinn_panel_credits_fail_open: "false"
    kinn_panel_credits_timeout_ms: "3000"
  kinnHomeport:
    replicaCount: 1
    port: 80
