global:
  dependencies:
    mongodb:
      url: ""
      port: 27017
    credentials:
      username: ""
      password: ""

redis:
  image: redis:latest
  url: ""
  port: 6379
  persistence:
    storageClass: "longhorn"
    size: "1Gi"

replicaCount: 1

kinn:
  ingress:
    host: "${client.key}-kinn.app.kinn.fr"
    tlsSecret: kinn-c4rbon-io2
    enabled: true
  kinnApi:
    replicaCount: 1
    port: 5055
    hmac_secret: 'dev-secret-change-me'
    token_ttl_sec: 86400
    seed: "true"
    plugin_import_enabled: 1
    default_company: "ACME"
    default_admin_email: "admin@acme.test"
    default_admin_password: "admin"
    default_workspace_name: "Default"
    # Liste des companies à créer au seed, séparées par virgules.
    # Vide = par défaut = ${default_company}+BETA (multi-tenant historique).
    # En single-tenant SaaS, mets une seule entrée = ${client.name}.
    seed_companies: ""
    # Bind direct de la 1ère company seedée à un org Zitadel.
    # Évite le `db.companies.updateOne(...)` manuel après déploiement.
    # En SaaS, Kinn-panel pose cet ID au moment de la création de l'instance.
    seed_company_zitadel_org_id: ""
    node_env: "production"
    # ── LLM provider ──
    ai_provider: "openai"           # "openai" | "anthropic"
    openai_api_key: ""
    openai_model: ""                # ex: "gpt-5.4" / "gpt-4o" / "gpt-4o-mini"
    anthropic_api_key: ""
    anthropic_model: ""             # ex: "claude-sonnet-4-5-20250929"
    mongo_db_name: "kinn-test"
    # ── Runtime container (gVisor / kata) ──
    # Vide = runc par défaut. Mettre "gvisor" si tu as installé runsc + RuntimeClass.
    runtimeClassName: ""
    # ── Sandbox d'exécution code IA (execute_code) ──
    # bwrap     : isolation Linux namespaces (besoin sysctl unprivileged_userns_clone=1)
    # subprocess: exécution directe — recommandé AVEC runtimeClassName=gvisor
    # none      : aucune isolation — DEV UNIQUEMENT
    # auto      : détection auto (bwrap si dispo, sinon subprocess)
    ai_sandbox_backend: "subprocess"
    ai_sandbox_python: "python3"
    ai_sandbox_py_site_packages: "/data/sandbox-pkgs"
    skills_bundle_dir: "/app/skills-bundle"
    # ── Tuning OpenAI (gpt-5.x) ──
    ai_reasoning_effort: "none"     # "none" | "low" | "medium" | "high" | "xhigh"
    ai_verbosity: "medium"          # "low" | "medium" | "high"
    ai_parallel_tool_calls: "0"     # "1" pour activer (défaut 0 = séquentiel)
    ai_max_tokens: "16384"
    ai_temperature: "0.7"
    # ── LLM "mini" pour webscraping / extraction de pages ──
    # Vide = défaut auto (haiku si Anthropic, gpt-4o-mini si OpenAI)
    web_mini_provider: ""           # "openai" | "anthropic"
    web_mini_model: ""              # ex: "gpt-4o-mini" / "claude-haiku-4-5"
    # ── Timeouts streaming / subagents ──
    ai_stream_timeout_ms: "240000"           # 4 min
    ai_subagent_heartbeat_timeout_ms: "180000"  # 3 min
    ai_max_subagent_depth: "3"
    # ── URLs publiques (HTTP trigger persistent URL + SSO callback) ──
    # Si vides, calculées depuis kinn.ingress.host. À remplir si tu utilises
    # un domaine custom différent du ingress par défaut.
    kinn_public_url: ""        # ex: https://${client.key}-kinn.app.kinn.fr
    frontend_base_url: ""      # ex: https://${client.key}-kinn.app.kinn.fr
    # ── HTTP Trigger entrant ──
    http_trigger_rate_limit_per_min: "120"
    # ── SSO Zitadel (injecté par Kinn-panel à la création de l'instance) ──
    # sso_mode: 'disabled' | 'hybrid' | 'enforced'
    sso_mode: "disabled"
    zitadel_issuer: ""                    # ex: https://kinn-mgmt.zitadel.cloud
    zitadel_client_id: ""
    zitadel_client_secret: ""
    zitadel_project_id: ""
    zitadel_redirect_uri: ""              # ex: https://<host>/api/auth/sso/callback
    zitadel_post_logout_uri: ""           # ex: https://<host>/login
    # Secret HMAC partagé pour valider les webhooks /internal/* poussés par Kinn-panel
    kinn_panel_hmac_secret: ""
    # Mapping rôles Zitadel → Kinn. Vide = 1:1 (admin/editor/viewer en miroir).
    # Format : "zitadelRole:kinnRole,...". "*:role" = fallback.
    # Ex : "superadmin:admin,poweruser:editor,readonly:viewer,*:viewer"
    sso_role_map: ""
  kinnHomeport:
    replicaCount: 1
    port: 80
