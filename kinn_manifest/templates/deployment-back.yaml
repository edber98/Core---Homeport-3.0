apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-kinn-api
spec:
  replicas: {{ .Values.kinn.kinnApi.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-kinn-api
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-kinn-api
        role: backend
    spec:
      {{- if .Values.kinn.kinnApi.runtimeClassName }}
      # Pointer sur une RuntimeClass alternative (gvisor / kata) — voir README.
      # Vide ou absent → runc par défaut (containerd standard).
      runtimeClassName: {{ .Values.kinn.kinnApi.runtimeClassName | quote }}
      {{- end }}
      containers:
        - name: kinn-api
          image: registry.c4rbon.group/edouard.bernier/kinn-homeport/api:v0.0.46
          ports:
            - containerPort: {{ .Values.kinn.kinnApi.port | int }}
          env:
            - name: AI_PROVIDER
              value: {{ .Values.kinn.kinnApi.ai_provider | default "openai" | quote }}
            - name: ANTHROPIC_API_KEY
              value: {{ .Values.kinn.kinnApi.anthropic_api_key | quote }}
            - name: ANTHROPIC_MODEL
              value: {{ .Values.kinn.kinnApi.anthropic_model | default "" | quote }}
            - name: PORT
              value: {{ .Values.kinn.kinnApi.port | quote }}
            - name: NODE_ENV
              value: {{ .Values.kinn.kinnApi.node_env | default "development" | quote }}
            - name: HMAC_SECRET
              value: {{ .Values.kinn.kinnApi.hmac_secret | quote }}
            # Clé AES de chiffrement des credentials (Credential.secret). CRITIQUE.
            - name: ENC_KEY
              value: {{ .Values.kinn.kinnApi.enc_key | default .Values.kinn.kinnApi.hmac_secret | quote }}
            - name: TOKEN_TTL_SEC
              value: {{ .Values.kinn.kinnApi.token_ttl_sec | quote }}
            - name: MONGO_URL
              value: {{ printf "%s:%v" .Values.kinn.mongodb.url .Values.kinn.mongodb.port | quote }}
            - name: MONGO_DB_NAME
              value: {{ .Values.kinn.kinnApi.mongo_db_name | quote }}
            - name: PLUGIN_IMPORT_ENABLED
              value: {{.Values.kinn.kinnApi.plugin_import_enabled | quote}}
            - name: SEED
              value: {{ .Values.kinn.kinnApi.seed | quote }}
            - name: DEFAULT_COMPANY
              value: {{ .Values.kinn.kinnApi.default_company | quote }}
            # Override la liste des companies seedées. Vide = seed par défaut
            # (default_company + BETA). Mettre = "${client.name}" pour 1 seule.
            {{- if .Values.kinn.kinnApi.seed_companies }}
            - name: SEED_COMPANIES
              value: {{ .Values.kinn.kinnApi.seed_companies | quote }}
            {{- end }}
            # Si défini, bind la 1ère company seedée à cet orgId Zitadel.
            # SSO marche dès le 1er login sans `db.companies.updateOne` manuel.
            {{- if .Values.kinn.kinnApi.seed_company_zitadel_org_id }}
            - name: SEED_COMPANY_ZITADEL_ORG_ID
              value: {{ .Values.kinn.kinnApi.seed_company_zitadel_org_id | quote }}
            {{- end }}
            # Crée admin/alice/demo. "0" = aucun user au seed (SaaS SSO).
            - name: SEED_DEMO_USERS
              value: {{ .Values.kinn.kinnApi.seed_demo_users | default "1" | quote }}
            # Crée system@kinn.local + service token. "0" = skip (SaaS SSO).
            - name: LOCAL_SERVICE_TOKEN_ENABLED
              value: {{ .Values.kinn.kinnApi.local_service_token_enabled | default "1" | quote }}
            - name: DEFAULT_ADMIN_EMAIL
              value: {{ .Values.kinn.kinnApi.default_admin_email | quote }}
            - name: DEFAULT_ADMIN_PASSWORD
              value: {{ .Values.kinn.kinnApi.default_admin_password | quote }}
            - name: DEFAULT_WORKSPACE_NAME
              value: {{ .Values.kinn.kinnApi.default_workspace_name | quote }}
            - name: OPENAI_API_KEY
              value: {{ .Values.kinn.kinnApi.openai_api_key | quote }}
            - name: OPENAI_MODEL
              value: {{ .Values.kinn.kinnApi.openai_model | quote }}
            - name: AI_DEBUG
              value: {{ .Values.kinn.kinnApi.ai_debug | default "0" | quote }}
            # ── IA LOCALE (vLLM / Ollama / LM Studio — OpenAI-compatible) ──
            - name: AI_BASE_URL
              value: {{ .Values.kinn.kinnApi.ai_base_url | default "" | quote }}
            - name: VLLM_BASE_URL
              value: {{ .Values.kinn.kinnApi.vllm_base_url | default "" | quote }}
            - name: VLLM_MODEL
              value: {{ .Values.kinn.kinnApi.vllm_model | default "" | quote }}
            - name: AI_MODEL_VLLM
              value: {{ .Values.kinn.kinnApi.ai_model_vllm | default "" | quote }}
            - name: VLLM_API_KEY
              value: {{ .Values.kinn.kinnApi.vllm_api_key | default "local" | quote }}
            - name: VLLM_MAX_TOKENS
              value: {{ .Values.kinn.kinnApi.vllm_max_tokens | default "0" | quote }}
            - name: AI_FORCE_CHAT_COMPLETIONS
              value: {{ .Values.kinn.kinnApi.ai_force_chat_completions | default "0" | quote }}
            # ── IA avancé (toggles agents/subagents) ──
            - name: AI_DEFAULT_MAX_LOOPS
              value: {{ .Values.kinn.kinnApi.ai_default_max_loops | default "100" | quote }}
            - name: AI_ENABLE_THINKING
              value: {{ .Values.kinn.kinnApi.ai_enable_thinking | default "0" | quote }}
            - name: AI_DISABLE_DOC_WRITER
              value: {{ .Values.kinn.kinnApi.ai_disable_doc_writer | default "0" | quote }}
            - name: AI_DISABLE_MEMORY_EXTRACTOR
              value: {{ .Values.kinn.kinnApi.ai_disable_memory_extractor | default "0" | quote }}
            - name: AI_DISABLE_SUBAGENT_ASYNC
              value: {{ .Values.kinn.kinnApi.ai_disable_subagent_async | default "0" | quote }}
            - name: AGENT_USE_QUEUE
              value: {{ .Values.kinn.kinnApi.agent_use_queue | default "0" | quote }}
            - name: AI_AGENT_WORKTREE_MODE
              value: {{ .Values.kinn.kinnApi.ai_agent_worktree_mode | default "shared" | quote }}
            - name: AI_MODEL_LIMITS
              value: {{ .Values.kinn.kinnApi.ai_model_limits | default "" | quote }}
            - name: SUBAGENT_DEPS_TIMEOUT_MS
              value: {{ .Values.kinn.kinnApi.subagent_deps_timeout_ms | default "3600000" | quote }}
            # ── Install de packages (sandbox code IA) ──
            - name: AI_PACKAGE_INSTALL_MODE
              value: {{ .Values.kinn.kinnApi.ai_package_install_mode | default "ask" | quote }}
            - name: AI_PACKAGE_INSTALL_MAX_PER_DAY
              value: {{ .Values.kinn.kinnApi.ai_package_install_max_per_day | default "20" | quote }}
            - name: AI_PACKAGE_WHITELIST
              value: {{ .Values.kinn.kinnApi.ai_package_whitelist | default "" | quote }}
            - name: AI_PACKAGE_BLACKLIST
              value: {{ .Values.kinn.kinnApi.ai_package_blacklist | default "" | quote }}
            # ── Mini-LLM + outils web de l'agent ──
            - name: WEB_MINI_BASE_URL
              value: {{ .Values.kinn.kinnApi.web_mini_base_url | default "" | quote }}
            - name: WEB_MINI_API_KEY
              value: {{ .Values.kinn.kinnApi.web_mini_api_key | default "" | quote }}
            - name: WEB_SEARCH_ENGINE
              value: {{ .Values.kinn.kinnApi.web_search_engine | default "bing" | quote }}
            - name: WEB_SEARCH_FALLBACK
              value: {{ .Values.kinn.kinnApi.web_search_fallback | default "brave" | quote }}
            - name: WEB_SEARCH_TIMEOUT_MS
              value: {{ .Values.kinn.kinnApi.web_search_timeout_ms | default "40000" | quote }}
            - name: WEB_HTTP_TIMEOUT_MS
              value: {{ .Values.kinn.kinnApi.web_http_timeout_ms | default "30000" | quote }}
            - name: WEB_BROWSER_TIMEOUT_MS
              value: {{ .Values.kinn.kinnApi.web_browser_timeout_ms | default "30000" | quote }}
            - name: WEB_FETCH_MAX_BYTES
              value: {{ .Values.kinn.kinnApi.web_fetch_max_bytes | default "5242880" | quote }}
            - name: WEB_FETCH_MAX_RAW_CHARS
              value: {{ .Values.kinn.kinnApi.web_fetch_max_raw_chars | default "80000" | quote }}
            # ── Redis (events temps réel / queue agents) ──
            - name: REDIS_HOST
              value: {{ .Values.kinn.kinnApi.redis_host | default "" | quote }}
            - name: REDIS_PORT
              value: {{ .Values.kinn.kinnApi.redis_port | default "6379" | quote }}
            - name: REDIS_PASSWORD
              value: {{ .Values.kinn.kinnApi.redis_password | default "" | quote }}
            # ── Stockage de fichiers ──
            - name: FILE_STORAGE_TYPE
              value: {{ .Values.kinn.kinnApi.file_storage_type | default "local" | quote }}
            - name: FILE_STORAGE_PATH
              value: {{ .Values.kinn.kinnApi.file_storage_path | default "/data/files" | quote }}
            - name: FILE_MAX_SIZE
              value: {{ .Values.kinn.kinnApi.file_max_size | default "200mb" | quote }}
            - name: FILE_TTL_DEFAULT
              value: {{ .Values.kinn.kinnApi.file_ttl_default | default "24h" | quote }}
            - name: FILE_CLEANUP_INTERVAL
              value: {{ .Values.kinn.kinnApi.file_cleanup_interval | default "1h" | quote }}
            - name: FILE_EXECUTION_CLEANUP_DELAY
              value: {{ .Values.kinn.kinnApi.file_execution_cleanup_delay | default "30m" | quote }}
            - name: FILE_S3_BUCKET
              value: {{ .Values.kinn.kinnApi.file_s3_bucket | default "" | quote }}
            - name: FILE_S3_REGION
              value: {{ .Values.kinn.kinnApi.file_s3_region | default "us-east-1" | quote }}
            - name: FILE_S3_ACCESS_KEY
              value: {{ .Values.kinn.kinnApi.file_s3_access_key | default "" | quote }}
            - name: FILE_S3_SECRET_KEY
              value: {{ .Values.kinn.kinnApi.file_s3_secret_key | default "" | quote }}
            - name: FILE_S3_ENDPOINT
              value: {{ .Values.kinn.kinnApi.file_s3_endpoint | default "" | quote }}
            # ── Plugins ──
            - name: PLUGIN_REPOS
              value: {{ .Values.kinn.kinnApi.plugin_repos | default "" | quote }}
            - name: PLUGIN_CLEANUP_ENABLED
              value: {{ .Values.kinn.kinnApi.plugin_cleanup_enabled | default "0" | quote }}
            # ── Sandbox d'exécution code (execute_code, install_package) ──
            # bwrap : namespaces Linux (besoin kernel.unprivileged_userns_clone=1)
            # subprocess : exécution directe — sûr SEULEMENT si runtimeClassName=gvisor
            # none : pas de sandbox — DEV UNIQUEMENT
            # auto : détection automatique (bwrap si dispo, sinon subprocess)
            - name: AI_SANDBOX_BACKEND
              value: {{ .Values.kinn.kinnApi.ai_sandbox_backend | default "subprocess" | quote }}
            # ── Tuning OpenAI (gpt-5.x) ──
            - name: AI_REASONING_EFFORT
              value: {{ .Values.kinn.kinnApi.ai_reasoning_effort | default "none" | quote }}
            - name: AI_VERBOSITY
              value: {{ .Values.kinn.kinnApi.ai_verbosity | default "medium" | quote }}
            - name: AI_PARALLEL_TOOL_CALLS
              value: {{ .Values.kinn.kinnApi.ai_parallel_tool_calls | default "0" | quote }}
            - name: AI_MAX_TOKENS
              value: {{ .Values.kinn.kinnApi.ai_max_tokens | default "16384" | quote }}
            - name: AI_TEMPERATURE
              value: {{ .Values.kinn.kinnApi.ai_temperature | default "0.7" | quote }}
            # ── LLM "mini" pour le webscraping / extraction de pages ──
            - name: WEB_MINI_PROVIDER
              value: {{ .Values.kinn.kinnApi.web_mini_provider | default "" | quote }}
            - name: WEB_MINI_MODEL
              value: {{ .Values.kinn.kinnApi.web_mini_model | default "" | quote }}
            # ── Timeouts agent / streaming ──
            - name: AI_STREAM_TIMEOUT_MS
              value: {{ .Values.kinn.kinnApi.ai_stream_timeout_ms | default "240000" | quote }}
            - name: AI_SUBAGENT_HEARTBEAT_TIMEOUT_MS
              value: {{ .Values.kinn.kinnApi.ai_subagent_heartbeat_timeout_ms | default "180000" | quote }}
            - name: AI_MAX_SUBAGENT_DEPTH
              value: {{ .Values.kinn.kinnApi.ai_max_subagent_depth | default "3" | quote }}
            # ── Storage / skills ──
            - name: SKILLS_BUNDLE_DIR
              value: {{ .Values.kinn.kinnApi.skills_bundle_dir | default "/app/skills-bundle" | quote }}
            - name: AI_SANDBOX_PYTHON
              value: {{ .Values.kinn.kinnApi.ai_sandbox_python | default "python3" | quote }}
            - name: AI_SANDBOX_PY_SITE_PACKAGES
              value: {{ .Values.kinn.kinnApi.ai_sandbox_py_site_packages | default "/data/sandbox-pkgs" | quote }}
            # ── URLs publiques (HTTP trigger + SSO callback) ──
            # Si non fournies, fallback sur https://<ingress.host>
            - name: KINN_PUBLIC_URL
              value: {{ .Values.kinn.kinnApi.kinn_public_url | default (printf "https://%s" .Values.kinn.ingress.host) | quote }}
            - name: FRONTEND_BASE_URL
              value: {{ .Values.kinn.kinnApi.frontend_base_url | default (printf "https://%s" .Values.kinn.ingress.host) | quote }}
            # ── HTTP Trigger entrant ──
            - name: HTTP_TRIGGER_RATE_LIMIT_PER_MIN
              value: {{ .Values.kinn.kinnApi.http_trigger_rate_limit_per_min | default "120" | quote }}
            # ── SSO Zitadel (injecté par Kinn-panel à la création de l'instance) ──
            - name: SSO_MODE
              value: {{ .Values.kinn.kinnApi.sso_mode | default "disabled" | quote }}
            - name: ZITADEL_ISSUER
              value: {{ .Values.kinn.kinnApi.zitadel_issuer | default "" | quote }}
            - name: ZITADEL_CLIENT_ID
              value: {{ .Values.kinn.kinnApi.zitadel_client_id | default "" | quote }}
            - name: ZITADEL_CLIENT_SECRET
              value: {{ .Values.kinn.kinnApi.zitadel_client_secret | default "" | quote }}
            - name: ZITADEL_PROJECT_ID
              value: {{ .Values.kinn.kinnApi.zitadel_project_id | default "" | quote }}
            - name: ZITADEL_REDIRECT_URI
              value: {{ .Values.kinn.kinnApi.zitadel_redirect_uri | default (printf "https://%s/api/auth/sso/callback" .Values.kinn.ingress.host) | quote }}
            - name: ZITADEL_POST_LOGOUT_URI
              value: {{ .Values.kinn.kinnApi.zitadel_post_logout_uri | default (printf "https://%s/login" .Values.kinn.ingress.host) | quote }}
            - name: KINN_PANEL_HMAC_SECRET
              value: {{ .Values.kinn.kinnApi.kinn_panel_hmac_secret | default "" | quote }}
            - name: SSO_ROLE_MAP
              value: {{ .Values.kinn.kinnApi.sso_role_map | default "" | quote }}
            # ── OAuth Bouncer (concentrateur auth.kinn.fr, injecté par Kinn-panel) ──
            - name: KINN_OAUTH_RELAY_SECRET
              value: {{ .Values.kinn.kinnApi.kinn_oauth_relay_secret | default "" | quote }}
            - name: KINN_OAUTH_CONCENTRATOR_URL
              value: {{ .Values.kinn.kinnApi.kinn_oauth_concentrator_url | default "https://auth.kinn.fr" | quote }}
            - name: GOOGLE_OAUTH_CLIENT_ID
              value: {{ .Values.kinn.kinnApi.google_oauth_client_id | default "" | quote }}
            - name: GOOGLE_OAUTH_CLIENT_SECRET
              value: {{ .Values.kinn.kinnApi.google_oauth_client_secret | default "" | quote }}
            - name: MICROSOFT_OAUTH_CLIENT_ID
              value: {{ .Values.kinn.kinnApi.microsoft_oauth_client_id | default "" | quote }}
            - name: MICROSOFT_OAUTH_CLIENT_SECRET
              value: {{ .Values.kinn.kinnApi.microsoft_oauth_client_secret | default "" | quote }}
            - name: META_OAUTH_CLIENT_ID
              value: {{ .Values.kinn.kinnApi.meta_oauth_client_id | default "" | quote }}
            - name: META_OAUTH_CLIENT_SECRET
              value: {{ .Values.kinn.kinnApi.meta_oauth_client_secret | default "" | quote }}
            - name: TIKTOK_OAUTH_CLIENT_KEY
              value: {{ .Values.kinn.kinnApi.tiktok_oauth_client_key | default "" | quote }}
            - name: TIKTOK_OAUTH_CLIENT_SECRET
              value: {{ .Values.kinn.kinnApi.tiktok_oauth_client_secret | default "" | quote }}
            # ── Système de crédits (Panel ↔ Kinn-app) ───────────────────────────
            # Injecté par le worker Kinn-panel selon Application.creditsEnabled.
            # Si "false" → helper kinn-app passe en mode standalone (mocks no-op).
            - name: KINN_PANEL_INTERNAL_URL
              value: {{ .Values.kinn.kinnApi.kinn_panel_internal_url | default "https://panel.kinn.fr" | quote }}
            # URL publique du Panel (frontend kinn-app → redirige l'user).
            # Fallback sur kinn_panel_internal_url si non définie.
            - name: KINN_PANEL_PUBLIC_URL
              value: {{ .Values.kinn.kinnApi.kinn_panel_public_url | default .Values.kinn.kinnApi.kinn_panel_internal_url | default "" | quote }}
            - name: KINN_PANEL_CREDITS_ENABLED
              value: {{ .Values.kinn.kinnApi.kinn_panel_credits_enabled | default "false" | quote }}
            - name: KINN_PANEL_APP_ID
              value: {{ .Values.kinn.kinnApi.kinn_panel_app_id | default "" | quote }}
            - name: KINN_PANEL_CLIENT_ID
              value: {{ .Values.kinn.kinnApi.kinn_panel_client_id | default "" | quote }}
            - name: KINN_PANEL_CREDITS_FAIL_OPEN
              value: {{ .Values.kinn.kinnApi.kinn_panel_credits_fail_open | default "false" | quote }}
            - name: KINN_PANEL_CREDITS_TIMEOUT_MS
              value: {{ .Values.kinn.kinnApi.kinn_panel_credits_timeout_ms | default "3000" | quote }}
