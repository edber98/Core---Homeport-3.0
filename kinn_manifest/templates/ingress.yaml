{{- if .Values.kinn.ingress.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-kinn
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: eg
      namespace: default
      sectionName: kinn-wildcards
  hostnames:
    - {{ .Values.kinn.ingress.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: {{ .Release.Name }}-kinn-api
          port: {{ .Values.kinn.kinnApi.port | int }}
    # Routes OAuth (callback bouncer Panel) — DOIVENT aller au backend Node,
    # pas au SPA Angular. Le chemin /oauth/<vendor>/callback est servi par
    # API/src/modules/oauth-connections.js et render une page HTML qui
    # postMessage + window.close() pour finaliser le flow popup.
    - matches:
        - path:
            type: PathPrefix
            value: /oauth
      backendRefs:
        - name: {{ .Release.Name }}-kinn-api
          port: {{ .Values.kinn.kinnApi.port | int }}
    # Catch-all → SPA Angular (Homeport). Doit rester en DERNIER pour ne
    # pas masquer les routes /api et /oauth ci-dessus.
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Release.Name }}-kinn-homeport
          port: {{ .Values.kinn.kinnHomeport.port | int }}
{{- end }}
