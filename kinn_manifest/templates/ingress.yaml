{{- if .Values.kinn.ingress.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-kinn
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: eg
      namespace: default
      sectionName: kinn-wildcards
  hostnames:
    - {{ .Values.kinn.ingress.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: {{ .Release.Name }}-kinn-api
          port: {{ .Values.kinn.kinnApi.port | int }}
    - matches:
        - path:
            type: PathPrefix
            value: /api/auth
      backendRefs:
        - name: {{ .Release.Name }}-kinn-api
          port: {{ .Values.kinn.kinnApi.port | int }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Release.Name }}-kinn-homeport
          port: {{ .Values.kinn.kinnHomeport.port | int }}
{{- end }}
