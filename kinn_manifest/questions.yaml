questions:
  # ────────────── Comptes par défaut ──────────────
  - variable: kinn.kinnApi.default_admin_email
    default: admin@acme.test
    type: string
    required: true
    label: Email de l'utilisateur par défaut
    group: Comptes

  - variable: kinn.kinnApi.default_admin_password
    type: password
    default: password
    required: true
    label: Mot de passe de l'utilisateur par défaut
    group: Comptes

  - variable: kinn.kinnApi.default_company
    type: string
    default: ACME
    label: Nom de l'entreprise par défaut
    group: Comptes

  - variable: kinn.kinnApi.default_workspace_name
    type: string
    default: Default
    label: Nom du workspace par défaut
    group: Comptes

  - variable: kinn.kinnApi.seed
    type: string
    default: "true"
    label: Générer initialisation base de données
    group: Comptes

  - variable: kinn.mongodb.url
    type: string
    default: "mongodb://192.168.147.40"
    label: Adresse base de données
    group: Comptes

  - variable: kinn.mongodb.port
    type: string
    default: "27017"
    label: Port de la base de données
    group: Comptes

  - variable: kinn.kinnApi.seed_companies
    type: string
    default: ""
    label: Companies à seeder (single-tenant SaaS)
    description: |
      Liste des companies à créer au démarrage, séparées par virgules.
      Vide = défaut historique (ACME + BETA).
      En SaaS single-tenant : mets le nom de TON client uniquement (ex: "C4rbon Group").
      Sinon le seed crée ACME + BETA et le SSO ne saura pas à quelle company rattacher l'user.
    group: Comptes

  - variable: kinn.kinnApi.seed_company_zitadel_org_id
    type: string
    default: ""
    label: Zitadel Org ID à bind au seed (optionnel)
    description: |
      Si défini, la 1ère company seedée reçoit ce zitadelOrgId.
      Permet au SSO de matcher dès le 1er login sans bind manuel.
      Vide = pas de bind (mais l'auto-bind se fera au 1er login s'il n'y a qu'1 company).
    group: SSO Zitadel

  - variable: kinn.kinnApi.seed_demo_users
    type: enum
    options:
      - "0"
      - "1"
    default: "1"
    label: Créer les users de démo au seed
    description: |
      "1" = crée admin@acme.test, alice@acme.test, demo@beta.test (utile dev).
      "0" = aucun user au seed. RECOMMANDÉ EN PROD SaaS avec SSO :
            le 1er admin est créé automatiquement via JIT au 1er login Zitadel.
    group: Comptes

  - variable: kinn.kinnApi.local_service_token_enabled
    type: enum
    options:
      - "0"
      - "1"
    default: "1"
    label: Service token Kinn local (plugin auto-référence)
    description: |
      "1" = crée system@kinn.local + service token au boot.
            Nécessaire seulement si tu utilises le plugin Kinn en mode auto-référence.
      "0" = skip. RECOMMANDÉ EN PROD SaaS qui n'utilise pas le plugin Kinn local.
    group: Avancé
  
  - variable: kinn.ingress.host
    type: string
    default: https://kinn.fr
    label: Url de Kinn
    group: Comptes

  # ────────────── Provider LLM principal ──────────────
  - variable: kinn.kinnApi.ai_provider
    type: enum
    options:
      - openai
      - anthropic
    default: openai
    required: true
    label: Provider LLM principal
    description: Choix du fournisseur d'IA pour l'agent principal
    group: LLM principal

  - variable: kinn.kinnApi.openai_api_key
    default: ""
    type: password
    label: Clé OpenAI
    description: Requise si provider = openai
    group: LLM principal
    show_if: "kinn.kinnApi.ai_provider=openai"

  - variable: kinn.kinnApi.openai_model
    default: ""
    type: string
    label: Modèle OpenAI
    description: 'Ex: gpt-5.4, gpt-4o, gpt-4o-mini. Vide = défaut config.'
    group: LLM principal
    show_if: "kinn.kinnApi.ai_provider=openai"

  - variable: kinn.kinnApi.anthropic_api_key
    default: ""
    type: password
    label: Clé Anthropic
    description: Requise si provider = anthropic
    group: LLM principal
    show_if: "kinn.kinnApi.ai_provider=anthropic"

  - variable: kinn.kinnApi.anthropic_model
    default: ""
    type: string
    label: Modèle Anthropic
    description: 'Ex: claude-sonnet-4-5-20250929, claude-haiku-4-5. Vide = défaut.'
    group: LLM principal
    show_if: "kinn.kinnApi.ai_provider=anthropic"

  # ────────────── Tuning LLM ──────────────
  - variable: kinn.kinnApi.ai_reasoning_effort
    type: enum
    options:
      - none
      - low
      - medium
      - high
      - xhigh
    default: none
    label: Niveau de raisonnement (OpenAI gpt-5.x)
    description: '"none" = streaming rapide. "low/medium/high" = réflexion plus poussée mais plus de tokens consommés.'
    group: Tuning LLM

  - variable: kinn.kinnApi.ai_verbosity
    type: enum
    options:
      - low
      - medium
      - high
    default: medium
    label: Verbosité (OpenAI gpt-5.x)
    description: '"high" recommandé pour analyses tabulaires complètes (préviionnel, P&L, etc.).'
    group: Tuning LLM

  - variable: kinn.kinnApi.ai_parallel_tool_calls
    type: enum
    options:
      - "0"
      - "1"
    default: "0"
    label: Tool calls parallèles (OpenAI)
    description: '0 = séquentiel (recommandé, évite le bug placeholder dans depends_on). 1 = active mode parallèle.'
    group: Tuning LLM

  - variable: kinn.kinnApi.ai_max_tokens
    type: string
    default: "16384"
    label: Tokens max par réponse
    group: Tuning LLM

  - variable: kinn.kinnApi.ai_temperature
    type: string
    default: "0.7"
    label: Température
    description: 0 = déterministe, 1 = créatif. Ignoré pour les modèles reasoning sans 'none'.
    group: Tuning LLM

  # ────────────── LLM mini pour webscraping ──────────────
  - variable: kinn.kinnApi.web_mini_provider
    type: enum
    options:
      - ""
      - openai
      - anthropic
    default: ""
    label: Provider LLM mini (webscraping)
    description: Vide = même provider que principal mais avec un modèle plus petit/rapide.
    group: Webscraping

  - variable: kinn.kinnApi.web_mini_model
    type: string
    default: ""
    label: Modèle LLM mini
    description: 'Ex: gpt-4o-mini ou claude-haiku-4-5. Vide = défaut auto.'
    group: Webscraping

  # ────────────── Sandbox sécurisée ──────────────
  - variable: kinn.kinnApi.runtimeClassName
    type: enum
    options:
      - ""
      - gvisor
      - kata
    default: ""
    label: RuntimeClass Kubernetes
    description: |
      Vide = runc par défaut. "gvisor" si tu as installé runsc + RuntimeClass sur tes nodes
      (cf. README pour la procédure). "kata" si tu utilises Kata Containers.
    group: Sandbox & sécurité

  - variable: kinn.kinnApi.ai_sandbox_backend
    type: enum
    options:
      - subprocess
      - bwrap
      - none
      - auto
    default: subprocess
    label: Backend sandbox d'exécution code
    description: |
      "subprocess" = exécution directe (sûr UNIQUEMENT avec runtimeClassName=gvisor).
      "bwrap" = namespaces Linux (besoin kernel.unprivileged_userns_clone=1).
      "none" = pas d'isolation (DEV).
      "auto" = bwrap si dispo, sinon subprocess.
    group: Sandbox & sécurité

  - variable: kinn.kinnApi.ai_sandbox_py_site_packages
    type: string
    default: "/data/sandbox-pkgs"
    label: Chemin packages Python sandbox
    description: Volume partagé pour les packages installés par install_package.
    group: Sandbox & sécurité

  # ────────────── Timeouts ──────────────
  - variable: kinn.kinnApi.ai_stream_timeout_ms
    type: string
    default: "240000"
    label: Timeout stream LLM (ms)
    description: 240000 = 4 minutes. Augmenter pour gros canvas/code.
    group: Timeouts

  - variable: kinn.kinnApi.ai_subagent_heartbeat_timeout_ms
    type: string
    default: "180000"
    label: Timeout heartbeat sous-agent (ms)
    description: 180000 = 3 min. Au-delà, un sous-agent sans heartbeat est marqué "stalled".
    group: Timeouts

  - variable: kinn.kinnApi.ai_max_subagent_depth
    type: string
    default: "3"
    label: Profondeur max sous-agents
    description: Limite récursive pour éviter les cascades infinies.
    group: Timeouts

  # ────────────── Avancé ──────────────
  - variable: kinn.kinnApi.node_env
    type: enum
    options:
      - production
      - development
    default: production
    label: NODE_ENV
    group: Avancé

  - variable: kinn.kinnApi.hmac_secret
    type: password
    default: "dev-secret-change-me"
    required: true
    label: HMAC secret
    description: À CHANGER en production. Sert à signer les tokens.
    group: Avancé

  - variable: kinn.kinnApi.token_ttl_sec
    type: string
    default: "86400"
    label: TTL des tokens (secondes)
    group: Avancé

  # ────────────── SSO Zitadel ──────────────
  - variable: kinn.kinnApi.sso_mode
    type: enum
    options:
      - disabled
      - hybrid
      - enforced
    default: disabled
    label: Mode SSO
    description: |
      disabled = login email/mot de passe seul.
      hybrid = SSO + login local possibles (recommandé MVP).
      enforced = SSO obligatoire (sauf comptes break-glass avec bypassSSO).
    group: SSO Zitadel

  - variable: kinn.kinnApi.zitadel_issuer
    type: string
    default: ""
    label: URL Issuer Zitadel
    description: ex. https://kinn-mgmt.zitadel.cloud (sans slash final).
    group: SSO Zitadel

  - variable: kinn.kinnApi.zitadel_client_id
    type: string
    default: ""
    label: Client ID OIDC
    description: ID de l'application OIDC créée par Kinn-panel dans le project Zitadel.
    group: SSO Zitadel

  - variable: kinn.kinnApi.zitadel_client_secret
    type: password
    default: ""
    label: Client Secret OIDC
    description: Secret de l'application OIDC (confidential client).
    group: SSO Zitadel

  - variable: kinn.kinnApi.zitadel_project_id
    type: string
    default: ""
    label: Project ID Zitadel
    description: ID du project Zitadel (utilisé pour scoper les claims roles).
    group: SSO Zitadel

  - variable: kinn.kinnApi.kinn_panel_hmac_secret
    type: password
    default: ""
    label: HMAC secret webhooks Kinn-panel
    description: |
      Secret partagé pour valider les webhooks /internal/* poussés par Kinn-panel
      (ex. invalidation de session quand un grant Zitadel est révoqué).
    group: SSO Zitadel

  - variable: kinn.kinnApi.zitadel_redirect_uri
    type: string
    default: ""
    label: Redirect URI (optionnel)
    description: Vide = calculé depuis ingress.host. Utile si custom domain différent.
    group: SSO Zitadel

  - variable: kinn.kinnApi.zitadel_post_logout_uri
    type: string
    default: ""
    label: Post-logout URI (optionnel)
    description: Vide = calculé depuis ingress.host (page /login).
    group: SSO Zitadel

  - variable: kinn.kinnApi.sso_role_map
    type: string
    default: ""
    label: Mapping rôles Zitadel → Kinn (optionnel)
    description: |
      Vide = 1:1 par défaut (Zitadel role 'admin' → Kinn 'admin', etc.).
      Format : "zitadelRole:kinnRole,...". Utilise "*:role" pour le fallback (défaut editor).
      Exemple : "superadmin:admin,poweruser:editor,readonly:viewer,*:viewer".
    group: SSO Zitadel
