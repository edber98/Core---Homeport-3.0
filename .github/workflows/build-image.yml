name: build-image

# Note : un pipeline GitLab CI (.gitlab-ci.yml) existe deja pour le frontend.
# Ce workflow GitHub construit l'image multi-arch de l'API pour Rancher.
# Si le repo est heberge sur GitLab uniquement, ignorer ce fichier.

on:
  push:
    branches:
      - main
      - feature/ia-agentic
    paths:
      - 'API/**'
      - 'k8s/**'
      - 'helm/**'
      - '.github/workflows/build-image.yml'
  pull_request:
    paths:
      - 'API/**'
  workflow_dispatch:

env:
  REGISTRY: registry.example.com
  IMAGE_NAME: homeport-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./API
          file: ./API/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        if: github.event_name != 'pull_request'
        run: echo "Pushed with digest ${{ steps.meta.outputs.digest }}"
