<div [formGroup]="form">
  <nz-form-item
    class="df-form-item"
    [class.df-cron]="field.type === 'cron'"
    [class.df-textblock]="field.type === 'textblock'"
    [style.--df-label-color]="$any(field).labelStyle?.color || null"
    [style.--df-label-font-size]="$any(field).labelStyle?.fontSize || null">

    <ng-container [ngSwitch]="field.type">

      <!-- textblock -->
      <ng-container *ngSwitchCase="'textblock'">
        <nz-form-control [nzSpan]="24">
          <nz-typography>
            <div [innerHTML]="field.textHtml || ''" [ngStyle]="$any(field).textStyle || null"></div>
          </nz-typography>
        </nz-form-control>
      </ng-container>

      <!-- inputs -->
      <ng-container *ngSwitchDefault>
        <nz-form-label *ngIf="field.type !== 'checkbox' || (!disableExpressions && $any(field).expression?.allow === true && exprEnabled)"
          [nzFor]="fieldKey"
          [nzRequired]="requiredFlag"
          [nzSpan]="labelSpan"
          [nzOffset]="labelOffset"
          [nzLabelAlign]="ui?.labelAlign ?? 'left'">
          {{ field.label || '' }}
        </nz-form-label>

        <nz-form-control
          [nzSpan]="controlSpan"
          [nzOffset]="controlOffset"
          [nzErrorTip]="(field.label || 'Champ') + ' invalide'">

          <div class="df-control-wrap">
            <!-- Toggle expression mode if allowed -->
            <div class="df-expr-toggle" *ngIf="!disableExpressions && ($any(field).expression?.allow === true)">
              <nz-segmented
                [(ngModel)]="exprMode"
                [ngModelOptions]="{ standalone: true }"
                [nzOptions]="[{label:'Val', value:'val'}, {label:'Expr', value:'expr'}]"
                nzSize="small"></nz-segmented>
            </div>

            <ng-container *ngIf="fieldKey as key">
              <!-- Guard: render classic inputs only when the control exists on the form -->
              <ng-container *ngIf="form.get(key) as ctrl">
              <!-- Exactly one branch renders: expression OR classic inputs -->
              <ng-container [ngSwitch]="(!disableExpressions && ($any(field).expression?.allow === true)) ? exprEnabled : false">
                <!-- Expression editor mode -->
                <app-expression-editor *ngSwitchCase="true"
                                       [inline]="$any(field).expression?.inline ?? true"
                                       [large]="$any(field).expression?.large === true"
                                       [showDialogAction]="$any(field).expression?.showDialogAction === true"
                                       [dialogTitle]="$any(field).expression?.dialogTitle || 'Éditeur d\'expression'"
                                       [dialogMode]="$any(field).expression?.dialogMode || 'textarea'"
                                       [autoHeight]="$any(field).expression?.autoHeight === true"
                                       [groupBefore]="$any(field).expression?.autoHeight === true && $any(field).expression?.groupBefore !== false"
                                       [showFormulaAction]="$any(field).expression?.autoHeight === true && $any(field).expression?.showFormulaAction !== false"
                                       [suggestionPlacement]="$any(field).expression?.suggestionPlacement || 'auto'"
                                       [errorMode]="$any(field).expression?.errorMode === true"
                                       [showPreview]="$any(field).expression?.showPreview !== false"
                                       [context]="ctx"
                                       [showPreviewErrors]="showPreviewErrors"
                                       [formControlName]="key">
                </app-expression-editor>

                <!-- Classic inputs -->
                <ng-container *ngSwitchDefault>
                  <label *ngIf="field.type==='checkbox'" nz-checkbox [formControlName]="key">{{ field.label || '' }}</label>

                <!-- Text input rendering (only for type==='text') -->
                <ng-container *ngIf="field.type==='text'">
                  <!-- Secret text input with show/hide toggle -->
                  <ng-container *ngIf="$any(field).secret; else plainTextInput">
                    <nz-input-group [nzSuffix]="secretToggleTpl">
                      <input nz-input [id]="key" [type]="secretVisible ? 'text' : 'password'" [placeholder]="field.placeholder || ''" [formControlName]="key" />
                    </nz-input-group>
                    <ng-template #secretToggleTpl>
                      <i class="fa-regular" [class.fa-eye]="!secretVisible" [class.fa-eye-slash]="secretVisible" (click)="secretVisible = !secretVisible" style="cursor:pointer;"></i>
                    </ng-template>
                  </ng-container>
                  <ng-template #plainTextInput>
                    <input nz-input [id]="key" type="text" [placeholder]="field.placeholder || ''" [formControlName]="key" />
                  </ng-template>
                </ng-container>

                  <textarea *ngIf="field.type==='textarea'"
                            nz-input [id]="key" [placeholder]="field.placeholder || ''" [formControlName]="key"></textarea>

                  <!-- Email input (HTML5 type=email for mobile keyboard + browser validation) -->
                  <ng-container *ngIf="field.type==='email'">
                    <ng-container *ngIf="$any(field).secret; else plainEmailInput">
                      <nz-input-group [nzSuffix]="secretToggleTplEmail">
                        <input nz-input [id]="key" [type]="secretVisible ? 'email' : 'password'" [placeholder]="field.placeholder || 'exemple@email.com'" [formControlName]="key" />
                      </nz-input-group>
                      <ng-template #secretToggleTplEmail>
                        <i class="fa-regular" [class.fa-eye]="!secretVisible" [class.fa-eye-slash]="secretVisible" (click)="secretVisible = !secretVisible" style="cursor:pointer;"></i>
                      </ng-template>
                    </ng-container>
                    <ng-template #plainEmailInput>
                      <input nz-input [id]="key" type="email" [placeholder]="field.placeholder || 'exemple@email.com'" [formControlName]="key" />
                    </ng-template>
                  </ng-container>

                  <!-- Tel input (HTML5 type=tel for mobile numeric keyboard) -->
                  <ng-container *ngIf="field.type==='tel'">
                    <ng-container *ngIf="$any(field).secret; else plainTelInput">
                      <nz-input-group [nzSuffix]="secretToggleTplTel">
                        <input nz-input [id]="key" [type]="secretVisible ? 'tel' : 'password'" [placeholder]="field.placeholder || '+33 6 12 34 56 78'" [formControlName]="key" />
                      </nz-input-group>
                      <ng-template #secretToggleTplTel>
                        <i class="fa-regular" [class.fa-eye]="!secretVisible" [class.fa-eye-slash]="secretVisible" (click)="secretVisible = !secretVisible" style="cursor:pointer;"></i>
                      </ng-template>
                    </ng-container>
                    <ng-template #plainTelInput>
                      <input nz-input [id]="key" type="tel" [placeholder]="field.placeholder || '+33 6 12 34 56 78'" [formControlName]="key" />
                    </ng-template>
                  </ng-container>

                  <!-- Color picker -->
                  <nz-color-picker *ngIf="field.type==='color'"
                                   [formControlName]="key"
                                   [nzShowText]="$any(field).color?.showText !== false"
                                   [nzAllowClear]="$any(field).color?.allowClear === true"></nz-color-picker>

                  <nz-rate *ngIf="field.type==='rate'"
                           [formControlName]="key"
                           [nzCount]="5"
                           [nzAllowHalf]="$any(field).rate?.allowHalf === true"></nz-rate>

                  <input *ngIf="field.type==='number'"
                        nz-input type="number" [id]="key" [placeholder]="field.placeholder || ''" [formControlName]="key" />

                  <nz-date-picker *ngIf="field.type==='date'"
                                  style="width: 100%;"
                                  [formControlName]="key"
                                  [nzFormat]="$any(field).date?.format || 'dd/MM/yyyy'"
                                  [nzShowTime]="$any(field).date?.showTime || false"
                                  [nzShowToday]="$any(field).date?.showToday !== false"
                                  [nzAllowClear]="$any(field).date?.allowClear !== false"
                                  [nzPlaceHolder]="field.placeholder || 'Sélectionner une date'"></nz-date-picker>

                  <nz-cron-expression *ngIf="field.type==='cron'"
                                      [formControlName]="key"
                                      [nzType]="$any(field).cron?.type || 'linux'"
                                      [nzSize]="$any(field).cron?.size || 'default'"
                                      [nzBorderless]="$any(field).cron?.borderless || false"
                                      [nzCollapseDisable]="$any(field).cron?.collapseDisable || false"></nz-cron-expression>

                  <ng-container *ngIf="field.type==='select'">
                    <select *ngIf="useNativeSelect; else zorroSelectField"
                            class="df-native-select"
                            [formControlName]="key">
                      <option [ngValue]="null">{{ field.placeholder || 'Sélectionner' }}</option>
                      <option *ngFor="let opt of (field.options || [])" [ngValue]="opt.value">{{ opt.label || '' }}</option>
                    </select>
                    <ng-template #zorroSelectField>
                      <nz-select [formControlName]="key" nzAllowClear nzShowSearch>
                        <nz-option *ngFor="let opt of (field.options || [])"
                                  [nzLabel]="opt.label || ''" [nzValue]="opt.value"></nz-option>
                      </nz-select>
                    </ng-template>
                  </ng-container>

                  <nz-radio-group *ngIf="field.type==='radio'" [formControlName]="key">
                    <label nz-radio *ngFor="let opt of (field.options || [])" [nzValue]="opt.value">{{ opt.label || '' }}</label>
                  </nz-radio-group>

                  <nz-select *ngIf="field.type==='tags'"
                             [formControlName]="key"
                             nzMode="tags"
                             nzAllowClear
                             [nzPlaceHolder]="field.placeholder || 'Ajouter...'">
                  </nz-select>

                  <df-file-field *ngIf="field.type==='file'"
                                 [formControlName]="key"
                                 [config]="$any(field).file || {}"></df-file-field>

                  <df-schema-builder *ngIf="field.type==='schema_builder'"
                                     [formControlName]="key"></df-schema-builder>
                </ng-container>
              </ng-container>
              </ng-container>
            </ng-container>
          </div>
        </nz-form-control>
      </ng-container>

    </ng-container>
  </nz-form-item>
</div>
