<div class="spacing" [formGroup]="group" style="margin-bottom:8px;">
  <div class="box-model">
    <svg class="connector-svg" viewBox="0 0 220 180" aria-hidden="true">
      <line class="margin" x1="66" y1="66" x2="0" y2="0" />
      <line class="margin" x1="154" y1="66" x2="220" y2="0" />
      <line class="margin" x1="154" y1="114" x2="220" y2="180" />
      <line class="margin" x1="66" y1="114" x2="0" y2="180" />
    </svg>
    <div class="label margin">Marge</div>
    <div class="label padding">Padding</div>
    <div class="content-box"></div>
    <div class="label content">contenu</div>

    <div class="field margin top">
      <input class="spacing-input" type="text" inputmode="numeric" pattern="[0-9]*" [formControlName]="ctrl('m_top')" />
    </div>
    <div class="field margin right">
      <input class="spacing-input" type="text" inputmode="numeric" pattern="[0-9]*" [formControlName]="ctrl('m_right')" />
    </div>
    <div class="field margin bottom">
      <input class="spacing-input" type="text" inputmode="numeric" pattern="[0-9]*" [formControlName]="ctrl('m_bottom')" />
    </div>
    <div class="field margin left">
      <input class="spacing-input" type="text" inputmode="numeric" pattern="[0-9]*" [formControlName]="ctrl('m_left')" />
    </div>

    <div class="field padding top">
      <input class="spacing-input" type="text" inputmode="numeric" pattern="[0-9]*" [formControlName]="ctrl('p_top')" />
    </div>
    <div class="field padding right">
      <input class="spacing-input" type="text" inputmode="numeric" pattern="[0-9]*" [formControlName]="ctrl('p_right')" />
    </div>
    <div class="field padding bottom">
      <input class="spacing-input" type="text" inputmode="numeric" pattern="[0-9]*" [formControlName]="ctrl('p_bottom')" />
    </div>
    <div class="field padding left">
      <input class="spacing-input" type="text" inputmode="numeric" pattern="[0-9]*" [formControlName]="ctrl('p_left')" />
    </div>
  </div>
</div>
