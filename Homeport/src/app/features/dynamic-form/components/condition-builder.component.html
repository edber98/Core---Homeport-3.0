<form [formGroup]="group" class="qb">
  <div class="qb-toolbar">
    <div class="qb-logic">
      <div class="qb-toggle">
        <button nz-button nzSize="small" type="button"
                [class.active]="group.get('logic')?.value==='all'"
                (click)="setLogic(group, 'all'); $event.preventDefault(); $event.stopPropagation()">AND</button>
        <button nz-button nzSize="small" type="button"
                [class.active]="group.get('logic')?.value==='any'"
                (click)="setLogic(group, 'any'); $event.preventDefault(); $event.stopPropagation()">OR</button>
      </div>
    </div>
    <div class="qb-toolbar-actions">
      <button nz-button nzType="dashed" (click)="addConditionRow.emit(); $event.preventDefault(); $event.stopPropagation()">+ Règle</button>
      <button nz-button nzType="dashed" (click)="addConditionGroup.emit(); $event.preventDefault(); $event.stopPropagation()">+ Groupe</button>
    </div>
  </div>

  <div class="qb-root">
    <div formArrayName="items" class="qb-items">
      <ng-container *ngFor="let grp of items.controls; let i=index">
        <div [formGroupName]="i" class="qb-item" [class.qb-item-group]="$any(grp).controls.kind.value==='group'" [class.qb-item-rule]="$any(grp).controls.kind.value==='rule'">
          <span class="qb-joiner" *ngIf="i>0">{{ group.get('logic')?.value === 'any' ? 'OR' : 'AND' }}</span>

          <div *ngIf="$any(grp).controls.kind.value==='rule'" class="qb-rule">
            <ng-container *ngIf="!isMobileOrTablet; else nativeRootField">
              <nz-select formControlName="field" nzPlaceHolder="Champ">
                <nz-option *ngFor="let k of inputFieldKeys" [nzValue]="k" [nzLabel]="k"></nz-option>
              </nz-select>
            </ng-container>
            <ng-template #nativeRootField>
              <select formControlName="field" class="qb-native-select qb-native-field">
                <option [ngValue]="null" disabled>Champ</option>
                <option *ngFor="let k of inputFieldKeys" [value]="k">{{ k }}</option>
              </select>
            </ng-template>
            <ng-container *ngIf="!isMobileOrTablet; else nativeRootOp">
              <nz-select formControlName="operator" class="op">
                <nz-option *ngFor="let op of operatorOptions" [nzValue]="op.value" [nzLabel]="op.label"></nz-option>
              </nz-select>
            </ng-container>
            <ng-template #nativeRootOp>
              <select formControlName="operator" class="qb-native-select qb-native-op">
                <option *ngFor="let op of operatorOptions" [value]="op.value">{{ op.label }}</option>
              </select>
            </ng-template>
            <input nz-input formControlName="value" placeholder="valeur" class="val"/>
            <button nz-button nzType="text" nzDanger class="qb-remove"
                    (click)="removeConditionRow.emit(i); $event.preventDefault(); $event.stopPropagation()">
              <i class="fa-solid fa-trash"></i>
            </button>
          </div>

          <div *ngIf="$any(grp).controls.kind.value==='group'" class="qb-group">
            <div class="qb-group-head">
              <div class="qb-logic">
                <div class="qb-toggle">
                  <button nz-button nzSize="small" type="button"
                          [class.active]="$any(grp).controls.logic.value==='all'"
                          (click)="setLogic($any(grp), 'all'); $event.preventDefault(); $event.stopPropagation()">AND</button>
                  <button nz-button nzSize="small" type="button"
                          [class.active]="$any(grp).controls.logic.value==='any'"
                          (click)="setLogic($any(grp), 'any'); $event.preventDefault(); $event.stopPropagation()">OR</button>
                </div>
              </div>
              <div class="qb-toolbar-actions">
                <button nz-button nzType="dashed" (click)="addSubRule.emit(i); $event.preventDefault(); $event.stopPropagation()">+ Règle</button>
                <button nz-button nzType="dashed" (click)="addSubGroup.emit(i); $event.preventDefault(); $event.stopPropagation()">+ Groupe</button>
                <button nz-button nzType="text" nzDanger class="qb-remove"
                        (click)="removeConditionRow.emit(i); $event.preventDefault(); $event.stopPropagation()">
                  <i class="fa-solid fa-trash"></i>
                </button>
              </div>
            </div>
            <div formArrayName="items" class="qb-subitems qb-group-body">
              <div *ngFor="let sub of subItemsAt(i).controls; let j=index" [formGroupName]="j" class="qb-item">
                <span class="qb-joiner" *ngIf="j>0">{{ $any(grp).controls.logic.value === 'any' ? 'OR' : 'AND' }}</span>
                <ng-container *ngIf="$any(sub).controls.kind?.value==='group'; else subRule">
                <div class="qb-group-head">
                  <div class="qb-logic">
                    <div class="qb-toggle">
                      <button nz-button nzSize="small" type="button"
                              [class.active]="$any(sub).controls.logic.value==='all'"
                                (click)="setLogic($any(sub), 'all'); $event.preventDefault(); $event.stopPropagation()">AND</button>
                        <button nz-button nzSize="small" type="button"
                                [class.active]="$any(sub).controls.logic.value==='any'"
                                (click)="setLogic($any(sub), 'any'); $event.preventDefault(); $event.stopPropagation()">OR</button>
                      </div>
                    </div>
                  </div>
                  <div class="qb-toolbar-actions">
                    <button nz-button nzType="dashed" (click)="addNestedRule.emit({ index: i, subIndex: j }); $event.preventDefault(); $event.stopPropagation()">+ Règle</button>
                    <button nz-button nzType="text" nzDanger class="qb-remove"
                            (click)="removeSubAt.emit({ index: i, subIndex: j }); $event.preventDefault(); $event.stopPropagation()">
                      <i class="fa-solid fa-trash"></i>
                    </button>
                  </div>
                  <div formArrayName="items" class="qb-subitems qb-group-body">
                    <div *ngFor="let sub2 of subItemsAtNested(i,j).controls; let k=index" [formGroupName]="k" class="qb-item">
                      <span class="qb-joiner" *ngIf="k>0">{{ $any(sub).controls.logic.value === 'any' ? 'OR' : 'AND' }}</span>
                      <ng-container *ngIf="$any(sub2).controls.kind?.value==='group'; else nestedRule">
                        <span style="font-style:italic; color:#999;">Groupe imbriqué</span>
                      </ng-container>
                      <ng-template #nestedRule>
                        <div class="qb-rule">
                          <ng-container *ngIf="!isMobileOrTablet; else nativeNestedField">
                            <nz-select formControlName="field" nzPlaceHolder="Champ">
                              <nz-option *ngFor="let k of inputFieldKeys" [nzValue]="k" [nzLabel]="k"></nz-option>
                            </nz-select>
                          </ng-container>
                          <ng-template #nativeNestedField>
                            <select formControlName="field" class="qb-native-select qb-native-field">
                              <option [ngValue]="null" disabled>Champ</option>
                              <option *ngFor="let k of inputFieldKeys" [value]="k">{{ k }}</option>
                            </select>
                          </ng-template>
                          <ng-container *ngIf="!isMobileOrTablet; else nativeNestedOp">
                            <nz-select formControlName="operator" class="op">
                              <nz-option *ngFor="let op of operatorOptions" [nzValue]="op.value" [nzLabel]="op.label"></nz-option>
                            </nz-select>
                          </ng-container>
                          <ng-template #nativeNestedOp>
                            <select formControlName="operator" class="qb-native-select qb-native-op">
                              <option *ngFor="let op of operatorOptions" [value]="op.value">{{ op.label }}</option>
                            </select>
                          </ng-template>
                          <input nz-input formControlName="value" placeholder="valeur" class="val"/>
                          <button nz-button nzType="text" nzDanger class="qb-remove"
                                  (click)="removeSubAt.emit({ index: i, subIndex: j }); $event.preventDefault(); $event.stopPropagation()">
                            <i class="fa-solid fa-trash"></i>
                          </button>
                        </div>
                      </ng-template>
                    </div>
                  </div>
                </ng-container>
                <ng-template #subRule>
                  <div class="qb-rule">
                    <ng-container *ngIf="!isMobileOrTablet; else nativeSubField">
                      <nz-select formControlName="field" nzPlaceHolder="Champ">
                        <nz-option *ngFor="let k of inputFieldKeys" [nzValue]="k" [nzLabel]="k"></nz-option>
                      </nz-select>
                    </ng-container>
                    <ng-template #nativeSubField>
                      <select formControlName="field" class="qb-native-select qb-native-field">
                        <option [ngValue]="null" disabled>Champ</option>
                        <option *ngFor="let k of inputFieldKeys" [value]="k">{{ k }}</option>
                      </select>
                    </ng-template>
                    <ng-container *ngIf="!isMobileOrTablet; else nativeSubOp">
                      <nz-select formControlName="operator" class="op">
                        <nz-option *ngFor="let op of operatorOptions" [nzValue]="op.value" [nzLabel]="op.label"></nz-option>
                      </nz-select>
                    </ng-container>
                    <ng-template #nativeSubOp>
                      <select formControlName="operator" class="qb-native-select qb-native-op">
                        <option *ngFor="let op of operatorOptions" [value]="op.value">{{ op.label }}</option>
                      </select>
                    </ng-template>
                    <input nz-input formControlName="value" placeholder="valeur" class="val"/>
                    <button nz-button nzType="text" nzDanger class="qb-remove"
                            (click)="removeSubAt.emit({ index: i, subIndex: j }); $event.preventDefault(); $event.stopPropagation()">
                      <i class="fa-solid fa-trash"></i>
                    </button>
                  </div>
                </ng-template>
              </div>
            </div>
          </div>
        </div>
      </ng-container>
    </div>
  </div>
</form>
