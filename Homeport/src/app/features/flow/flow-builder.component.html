<div class="flow-builder" cdkDropListGroup [class.desktop]="!isTabletOrBelow"
  [class.right-panel-open]="!isTabletOrBelow && rightPanelOpen"
  [class.left-panel-open]="!isTabletOrBelow && leftPanelOpen">
  <!-- Reusable left panel content (desktop + drawer) -->
  <ng-template #leftPanelContent let-mode="mode">
    <flow-palette-panel [mode]="'outside'" [groups]="paletteGroups" [query]="paletteQuery" [isMobile]="isMobile"
      [dndDisabled]="dndDisabled" [trackGroupFn]="trackGroup" [trackItemFn]="trackItem"
      [miniIconClassFn]="miniIconClass.bind(this)" [simpleIconUrlFn]="simpleIconUrl.bind(this)" [typeIconClassFn]="typeIconClass.bind(this)"
      [isItemDisabledFn]="isPaletteItemDisabled.bind(this)" [isDraggingFn]="isDragging.bind(this)"
      (queryChange)="onPaletteQueryChange($event)" (itemClick)="onPaletteClick($event)"
      (dragStart)="onDragStart($event.item, $event.$event)"
      (dragEnd)="onDragEnd($event.item, $event.$event)"></flow-palette-panel>
  </ng-template>

  <!-- Desktop left panel -->
  <div class="left-panel" *ngIf="!isMobile" [class.closed]="!leftPanelOpen">
    <ng-container [ngTemplateOutlet]="leftPanelContent"
      [ngTemplateOutletContext]="{ mode: 'outside' }"></ng-container>
  </div>

  <section class="canvas">
    <!-- Removed canvas-shield interceptors to avoid event conflicts on mobile -->
    <!-- Desktop-style panel toggle FABs: visible on all sizes; open drawers on narrow screens -->
    <div class="canvas-host" #flowHost cdkDropList id="canvasList" [cdkDropListData]="nodes" (click)="onCanvasClick($event)"
      [cdkDropListDisabled]="dndDisabled" [class.disabled]="leftDrawer || rightDrawer"
      (cdkDropListEntered)="onDragEnter($event)" (cdkDropListExited)="onDragLeave($event)"
      (dragover)="onDragOver($event)" (wheel)="onWheel($event)" (cdkDropListDropped)="onExternalDrop($event)"
      (contextmenu)="$event.preventDefault()" (mousedown)="onCanvasMouseDown($event)" (mousemove)="onCanvasMouseMove($event)" (mouseup)="onCanvasMouseUp($event)">
      <!-- Loading overlay during flow document fetch -->
      <div class="loading-overlay" *ngIf="loadingFlowDoc">
        <div class="spinner"></div>
        <div class="text">Chargement du flow…</div>
      </div>
      <vflow view="auto" [background]="flowBackground" [entitiesSelectable]="true" [minZoom]="0.05" [maxZoom]="3" [nodes]="nodesView" [alignmentHelper]="alignmentHelperInput" [snapGrid]="snapGridInput" [keyboardShortcuts]="{ multiSelection: ['ShiftLeft', 'ShiftRight'] }"
        [edges]="renderedEdges" [connection]="connectionSettings" (onConnect)="onConnect($event)"
        (onComponentNodeEvent)="onComponentNodeEvent($event)" (onNodesChange.position.single)="onNodePositionChange($event)" (onNodesChange.position.many)="onNodesPositionMany($event)"
        (onNodesChange.remove.many)="onNodesRemoved($event)" (onEdgesChange.remove)="onEdgesRemoved($event)"
        (onEdgesChange.detached)="onEdgesDetached($event)" #flow>
        <ng-template let-ctx edge>
          <svg:g customTemplateEdge>
            <svg:path fill="none" [attr.d]="ctx.path()" 
              [attr.stroke-width]="ctx.edge.data?.error ? 2 : (ctx.edge.data?.strokeWidth || 2)"
              [attr.stroke]="ctx.edge.data?.error ? '#f759ab' : (ctx.edge.data?.color || '#b1b1b7')"
              [attr.marker-end]="ctx.markerEnd()" />
          </svg:g>
        </ng-template>
        <ng-template let-ctx edgeLabelHtml>
          <div class="edge-labels"
            [ngClass]="{ error: ctx.edge.data?.error || (getEdgeLabel(ctx.edge) || (ctx.label.data?.text || '')) === 'Error' }">
            <div class="badge label" *ngIf="(getEdgeLabel(ctx.edge) || (ctx.label.data?.text || '')) as txt"
              [ngClass]="{ error: ctx.edge.data?.error || txt === 'Error' }">{{ txt }}</div>
            <button class="badge delete" title="Supprimer" type="button" *ngIf="!isEdgeDeleteDisabled(ctx.edge)"
              (pointerdown)="$event.stopPropagation()" (mousedown)="$event.stopPropagation()"
              (touchstart)="$event.stopPropagation()" (click)="onDeleteEdgeClick($event, ctx.edge)">
              <i class="fa-regular fa-circle-xmark"></i>
            </button>
          </div>
        </ng-template>
        <ng-template  let-ctx nodeHtml>

          <div class="node-card"  [attr.data-node-id]="ctx.node.id"
            [ngClass]="{ 'select-node': isSelected(ctx.node.id), 'error-branch': isNodeInError(ctx.node.id), 'hard-error': isNodeHardError(ctx.node.id), 'horizontal': portOrientation === 'horizontal' }"
            (click)="onNodeClick($event, ctx)" (dblclick)="onNodeDoubleClick($event, ctx.node)" (contextmenu)="onNodeContextMenu($event, ctx.node)"
            (touchstart)="onNodeTouchStart($event, ctx.node)" (touchmove)="onNodeTouchMove($event)"
            (touchend)="onNodeTouchEnd()">
   
              <div class="error-badge" *ngIf="isNodeHardError(ctx.node.id)" nz-tooltip [nzTooltipTitle]="nodeErrorTooltip(ctx.node.id)">
                <i class="fa-solid fa-triangle-exclamation"></i>
              </div>
          
              <div class="center-wrap">
                <node-card-header
                  [title]="ctx.node.data.model.templateObj?.title || ctx.node.data.model?.name"
                  [subtitle]="ctx.node.data.model.templateObj?.subtitle || ctx.node.data.model.templateObj?.category || ctx.node.data.model.templateObj?.type"
                  [typeIcon]="typeIconClass(ctx.node.data.model.templateObj)"
                  [app]="getAppById((ctx.node.data.model.templateObj?.app && ctx.node.data.model.templateObj?.app._id) ? ctx.node.data.model.templateObj?.app._id : ctx.node.data.model.templateObj?.appId)"
                  [appId]="(ctx.node.data.model.templateObj?.app && ctx.node.data.model.templateObj?.app._id) ? ctx.node.data.model.templateObj?.app._id : ctx.node.data.model.templateObj?.appId"
                ></node-card-header>
              </div>
          
              <ng-container *ngIf="!isTriggerTemplate(ctx.node.data.model.templateObj) && (ctx.node.data.model.templateObj?.inputHandles?.length || 0) > 0; else singleIn">
                <div class="inputs" *ngIf="ctx.node.data.model.templateObj.inputHandles as ins">
                  <div class="in" *ngFor="let ih of ins; let i = index">
                    <ng-template #ihTpl let-hctx>
                    <svg:g>
                      
                      <svg:circle [attr.cx]="hctx.point().x" [attr.cy]="hctx.point().y"
                        [attr.r]="hctx.state() === 'valid' ? 6 : 4"
                        [attr.fill]="isNodeInError(ctx.node.id) ? '#f759ab' : '#000000'"
                        [attr.stroke]="connectingEdge ? (hctx.state() === 'valid' ? '#22c55e' : (canConnectPreview(ctx.node.id, ih.id) ? '#3b82f6' : '#ef4444')) : '#ffffff'" [attr.stroke-width]="connectingEdge ? 2 : 1"
                        [style.cursor]="hctx.state() === 'valid' ? 'crosshair' : 'pointer'"
                        (mouseenter)="onTargetEnter($event, hctx.state() === 'valid')"
                        (mousemove)="onTargetMove($event, hctx.state() === 'valid')"
                        (mouseleave)="onTargetLeave()"
                      ></svg:circle>
                    </svg:g>
                    </ng-template>
                    <ng-container *ngIf="portOrientation === 'vertical'; else horizInputMulti">
                      <handle position="top" type="target" [id]="ih.id" [template]="ihTpl" />
                    </ng-container>
                    <ng-template #horizInputMulti>
                    <div style="position: absolute; left: 0;" [style.top.px]="horizHandleTop(i, ins.length)">
                        <handle position="left" type="target" [id]="ih.id" [template]="ihTpl" />
                    </div>
                    </ng-template>
                  </div>
                </div>
              </ng-container>
              <ng-template #singleIn>
                <ng-container *ngIf="!isTriggerTemplate(ctx.node.data.model.templateObj)">
                  <ng-container *ngIf="inputId(ctx.node.data.model.templateObj) as inId">
                  <ng-template #handleInTpl let-hctx>
                    <svg:g>
                      <svg:circle [attr.cx]="hctx.point().x" [attr.cy]="hctx.point().y"
                        [attr.r]="hctx.state() === 'valid' ? 6 : 4"
                        [attr.fill]="isNodeInError(ctx.node.id) ? '#f759ab' : '#000000'" 
                        [attr.stroke]="connectingEdge ? (hctx.state() === 'valid' ? '#22c55e' : (canConnectPreview(ctx.node.id, inId) ? '#3b82f6' : '#ef4444')) : '#ffffff'" [attr.stroke-width]="connectingEdge ? 2 : 1"
                        [style.cursor]="hctx.state() === 'valid' ? 'crosshair' : 'pointer'"
                        (mouseenter)="onTargetEnter($event, hctx.state() === 'valid')"
                        (mousemove)="onTargetMove($event, hctx.state() === 'valid')"
                        (mouseleave)="onTargetLeave()"
                      ></svg:circle>
                    </svg:g>
                  </ng-template>
                  <ng-container *ngIf="portOrientation === 'vertical'; else horizInputSingle">
              
                    <handle position="top" type="target" [id]="inId" [template]="handleInTpl" />
                  </ng-container>
                  <ng-template #horizInputSingle>
                    <div style="position: absolute; left: 0; top: 23px">
                      <handle position="left" type="target" [id]="inId" [template]="handleInTpl" />
                    </div>
                  </ng-template>
                  </ng-container>
                </ng-container>
              </ng-template>
              <div class="outputs" *ngIf="outputIds(ctx.node.data.model)?.length as outs">
                <div class="out" *ngFor="let out of outputIds(ctx.node.data.model); let i = index"
                  [ngClass]="{ error: out === 'err' }">
        
                  <ng-template #hTpl let-hctx>
                    <svg:g>
                    <svg:circle [attr.cx]="hctx.point().x" [attr.cy]="hctx.point().y"
                      [attr.r]="hctx.state() === 'valid' ? 6 : 4"
                      [attr.fill]="(out === 'err' || isNodeInError(ctx.node.id)) ? '#f759ab' : '#000000'"
                      [attr.stroke]="'#ffffff'" stroke-width="1" [style.cursor]="hctx.state() === 'valid' ? 'crosshair' : 'pointer'"
                      (pointerdown)="onConnectStartFrom(ctx.node.id, out)"
                      (mouseenter)="onHandleEnter($event, ctx.node.data.model, out)" (mousemove)="onHandleMove($event)"
                      (mouseleave)="onHandleLeave()"></svg:circle>
                    </svg:g>
                  </ng-template>
                  <ng-container *ngIf="portOrientation === 'vertical'; else horizOutput">
                    <handle position="bottom" type="source" [id]="out" [template]="hTpl" />
                  </ng-container>
                <ng-template #horizOutput>
                  <div style="position: absolute; right: 0;" [style.top.px]="horizHandleTop(i, outs)">
                    <handle position="right" type="source" [id]="out" [template]="hTpl" />
                  </div>
                </ng-template>
               </div>
          </div>
            <!-- Link handles (targets on the right) for v2 -->
            <div class="links" *ngIf="linkHandlesForNode(ctx.node.id, ctx.node.data.model)?.length as links">
              <div class="link" *ngFor="let lh of linkHandlesForNode(ctx.node.id, ctx.node.data.model)">
                <div class="link-label">{{ lh.name }}</div>
                <ng-template #linkTpl let-hctx>
                  <svg:g>
                    <svg:circle [attr.cx]="hctx.point().x" [attr.cy]="hctx.point().y"
                      [attr.r]="hctx.state() === 'valid' ? 6 : 4"
                      [attr.fill]="'#111'" [attr.stroke]="connectingEdge ? (hctx.state() === 'valid' ? '#22c55e' : (canConnectPreview(ctx.node.id, lh.id) ? '#3b82f6' : '#ef4444')) : '#ffffff'" [attr.stroke-width]="connectingEdge ? 2 : 1" [style.cursor]="hctx.state() === 'valid' ? 'crosshair' : 'pointer'"
                      (mouseenter)="onTargetEnter($event, hctx.state() === 'valid')"
                      (mousemove)="onTargetMove($event, hctx.state() === 'valid')"
                      (mouseleave)="onTargetLeave()"
                    ></svg:circle>
                  </svg:g>
                </ng-template>
                <ng-container *ngIf="portOrientation === 'vertical'; else horizLink">
                  <handle position="bottom" type="target" [id]="lh.id" [template]="linkTpl" />
                </ng-container>
                <ng-template #horizLink>
                  <!-- In horizontal mode, place linked handles at bottom with label above -->
                  <handle position="bottom" type="target" [id]="lh.id" [template]="linkTpl" />
                </ng-template>
              </div>
            </div>
            <div class="exec-badge" *ngIf="nodeExecStatus(ctx.node.id) as st">
              <i class="fa-solid" [ngClass]="st.lastStatus === 'success' ? 'fa-circle-check ok' : (st.lastStatus === 'error' ? 'fa-triangle-exclamation err' : 'fa-clock pending')" title="Etat dernière exécution"></i>
              <span class="cnt" *ngIf="st.count as c">{{ c }}</span>
            </div>
            </div>
     
        </ng-template>
        <ng-template let-ctx connectionTemplate>
          <div class="edge-labels">
            <div class="badge label"
              [ngClass]="{ error: (computeEdgeLabel(ctx.connection?.source, ctx.connection?.sourceHandle) || '') === 'Error' }"
              *ngIf="computeEdgeLabel(ctx.connection?.source, ctx.connection?.sourceHandle) as txt">{{ txt }}</div>
          </div>
        </ng-template>
      </vflow>
      <!-- Capture overlay to block pan/zoom while dragging selection -->
      <div class="selection-capture" *ngIf="selectionBoxStart"
           (contextmenu)="$event.preventDefault()"
           (mousedown)="$event.preventDefault(); $event.stopPropagation()"
           (mousemove)="onCanvasMouseMove($event)"
           (mouseup)="onCanvasMouseUp($event)"></div>
      <!-- Selection rectangle overlay (fixed to viewport) -->
      <div class="selection-box" *ngIf="selectionBoxRect as r"
        [style.left.px]="r.left" [style.top.px]="r.top" [style.width.px]="r.width" [style.height.px]="r.height"></div>
      <!-- lightweight tooltip overlay -->
      <div class="flow-tooltip" *ngIf="tipVisible" [style.left.px]="tipX" [style.top.px]="tipY"
        [ngClass]="{ error: tipError }">{{ tipText }}</div>
      <div class="ban-overlay" *ngIf="banVisible" [style.left.px]="banX" [style.top.px]="banY" title="Connexion invalide">
        <i class="fa-solid fa-ban" style="color:#ef4444;"></i>
      </div>
    </div>
  </section>


  <!-- Reusable right panel content (desktop + drawer) -->
  <!-- Desktop right panel: inspector only (Snapshots only in drawer on mobile) -->
  <div class="right-panel" *ngIf="!isMobile" [class.closed]="!rightPanelOpen">
    <flow-right-panel [mode]="'outside'"
      [selected]="selectedNode" [selectedList]="selectionList" [selectedModel]="selectedModel"
      [nodeHasError]="selectedNode?.id ? (isNodeHardError(selectedNode.id) || isNodeInError(selectedNode.id)) : false"
      [nodeErrorText]="selectedNode?.id ? nodeErrorTooltip(selectedNode.id) : null"
      [selectedAttempt]="getLastAttemptFor(selectedNode?.id)"
      [inspectorTab]="inspectorTab" (inspectorTabChange)="inspectorTab = $event" [editJson]="editJson"
      (editJsonChange)="editJson = $event" (openAdvanced)="openAdvancedEditor()" (delete)="deleteSelected()" (openSingle)="onInspectorOpenSingle($event)" (deleteMany)="onDeleteMany()" (saveJson)="saveSelectedJson()"
      [currentFlowName]="currentFlowName" [currentFlowDesc]="currentFlowDesc" [currentFlowStatus]="currentFlowStatus" [currentFlowEnabled]="currentFlowEnabled"
      [builderMode]="builderMode" [lastRun]="lastRun" [currentRun]="currentRun" [canSave]="canSave"
      [runInfo]="currentRunMeta" [selectedRunId]="currentRunMeta?.id || backendRunId" [recentRuns]="recentRuns" [runsHasMore]="runsHasMore" (run)="runFlow()" (stop)="stopLastRun()" (save)="saveFlow()" (metaChange)="onMetaChange()" (clearRun)="onClearRun()" (restart)="onRestartRun()" (selectRun)="onSelectRun($event)" (loadMoreRuns)="onLoadMoreRuns()"
      [timelinePastItems]="timelinePastItemsCache" [timelineFutureItems]="timelineFutureItemsCache"
      (hoverPast)="onHistoryHoverPast($event)" (hoverFuture)="onHistoryHoverFuture($event)" (leave)="onHistoryHoverLeave()" (clickPast)="onHistoryClickPast($event)" (clickFuture)="onHistoryClickFuture($event)"
    ></flow-right-panel>
  </div>
  <button nz-button nzSize="small" class="panel-toggle-fab" type="button"
    (click)="toggleRightPanel()"
    aria-label="Ouvrir ou fermer le panneau droit">
    <svg width="20" height="20" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="48" height="48" fill="white" fill-opacity="0.01"/>
        <path d="M41.5 10H35.5" stroke="#6b7280" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M27.5 6V14" stroke="#6b7280" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M27.5 10L5.5 10" stroke="#6b7280" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M13.5 24H5.5" stroke="#6b7280" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M21.5 20V28" stroke="#6b7280" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M43.5 24H21.5" stroke="#6b7280" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M41.5 38H35.5" stroke="#6b7280" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M27.5 34V42" stroke="#6b7280" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M27.5 38H5.5" stroke="#6b7280" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
  </button>
  <button nz-button nzSize="small" class="panel-toggle-fab left" type="button"
    (click)="toggleLeftPanel()"
    aria-label="Ouvrir ou fermer le panneau gauche">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" id="sidebar">
      <g fill="none" fill-rule="evenodd" stroke="#6b7280" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" transform="translate(1 1)">
        <rect width="16" height="16" rx="2"></rect>
        <path d="M6 0v18"></path>
      </g>
    </svg>
  </button>
  <div class="import-overlay" *ngIf="isImporting">
    <div class="spinner"></div>
    <div>Import du flow…</div>
  </div>
  <!-- Left vertical floating actions (responsive only) -->
  <div class="left-bar">
    <div class="actions">
      <button class="icon-btn" (click)="saveFlow()" [disabled]="!canSave" title="Sauvegarder" aria-label="Sauvegarder">
        <i class="fa-solid fa-floppy-disk"></i>
      </button>
      <button class="icon-btn" (click)="runFlow()" title="Lancer" aria-label="Lancer">
        <i class="fa-solid fa-play"></i>
      </button>
      <button class="icon-btn" (click)="openAdvancedEditor()" [disabled]="!selectedModel" title="Configurer / Tester">
        <i class="fa-solid fa-flask"></i>
      </button>
      <button class="icon-btn" (click)="exportFlow()" title="Exporter" aria-label="Exporter">
        <i class="fa-solid fa-cloud-arrow-down"></i>
      </button>
      <label class="icon-btn import-btn" title="Importer" aria-label="Importer">
        <i class="fa-solid fa-file-arrow-up"></i>
        <input type="file" accept="application/json,.json" (change)="importFlow($event)" hidden>
      </label>
    </div>
  </div>

  <div class="bottom-bar">
    <div class="actions">
      <button class="icon-btn" (click)="undo()" [disabled]="!canUndo" title="Annuler">
        <i class="fa-solid fa-rotate-left"></i>
      </button>
      <button class="icon-btn" (click)="redo()" [disabled]="!canRedo" title="Rétablir">
        <i class="fa-solid fa-rotate-right"></i>
      </button>
      <span class="divider" aria-hidden="true"></span>
      <button class="icon-btn" (click)="centerFlow()" title="Centrer le flow">
        <i class="fa-regular fa-object-group"></i>
      </button>
      <button class="icon-btn" (click)="togglePortOrientation()" [title]="portOrientation === 'vertical' ? 'Ports: vertical' : 'Ports: horizontal'">
        <i class="fa-solid" [ngClass]="portOrientation === 'vertical' ? 'fa-arrows-up-down' : 'fa-arrows-left-right'"></i>
      </button>
      <button class="icon-btn" (click)="toggleAlignmentHelper()" [title]="alignmentHelper ? 'Aides d\'alignement: activées' : 'Aides d\'alignement: désactivées'">
        <i class="fa-solid" [ngClass]="alignmentHelper ? 'fa-grip-lines' : 'fa-grip-lines-vertical'"></i>
      </button>
      <button class="icon-btn" (click)="toggleSnapGrid()" [title]="snapGrid ? 'Grille magnétique: activée' : 'Grille magnétique: désactivée'">
        <i class="fa-solid fa-border-all"></i>
      </button>
      <button class="icon-btn" *ngIf="validationIssues.length" nz-popover nzPopoverTrigger="click" [nzPopoverTitle]="'Problèmes détectés (' + validationIssues.length + ')'" [nzPopoverContent]="issuesTpl" title="Problèmes">
        <i class="fa-solid fa-triangle-exclamation" style="color:#ef4444"></i>
      </button>
      <ng-template #issuesTpl>
        <div style="max-width:320px; max-height: 260px; overflow:auto;">
          <button type="button" style="display:block; width:100%; text-align:left; border:0; background:transparent; padding:4px 0; font-size:12px; color:#111; cursor:pointer;" *ngFor="let it of validationIssues" (click)="onIssueClick(it)">
            <span *ngIf="it.nodeId" style="color:#6b7280">[Node {{ it.nodeId }}]</span>
            <span> {{ it.message }}</span>
          </button>
        </div>
      </ng-template>
      <button class="icon-btn" (click)="centerOnSelection()" [disabled]="!selectedNode" title="Centrer sur le nœud sélectionné">
        <i class="fa-solid fa-crosshairs"></i>
      </button>
      <span class="divider" *ngIf="!isMobile" aria-hidden="true"></span>
      <div class="zoom-control" *ngIf="!isMobile">
        <span class="label">Zoom</span>
        <input type="range" min="5" max="300" step="1" [ngModel]="zoomPercent" (ngModelChange)="onZoomSlider($event)" />
        <span class="value">{{ zoomPercent }}%</span>
      </div>
      <span class="divider" *ngIf="!isMobile" aria-hidden="true"></span>
      <span class="toast" *ngIf="toastMsg">{{ toastMsg }}</span>

      <label class="icon-btn import-btn desktop-only" title="Importer" aria-label="Importer">
        <i class="fa-solid fa-file-arrow-up"></i>
        <input type="file" accept="application/json,.json" (change)="importFlow($event)" hidden>
      </label>
      <button class="icon-btn desktop-only" (click)="exportFlow()" title="Exporter" aria-label="Exporter">
        <i class="fa-solid fa-cloud-arrow-down"></i>
      </button>
      <button class="icon-btn desktop-only" (click)="saveFlow()" [disabled]="!canSave" title="Sauvegarder" aria-label="Sauvegarder">
        <i class="fa-solid fa-floppy-disk"></i>
      </button>
      <span class="spacer"></span>
      <span class="divider" aria-hidden="true"></span>
      <button class="run-btn" (click)="runFlow()" title="Lancer" aria-label="Lancer">
        <i class="fa-solid fa-play"></i>
        <span>Lancer</span>
      </button>
    </div>
  </div>


  <!-- Context menu overlay -->
  <div class="ctx-overlay" *ngIf="ctxMenuVisible" (click)="closeCtxMenu()"></div>
  <div class="ctx-menu" *ngIf="ctxMenuVisible" [style.left.px]="ctxMenuX" [style.top.px]="ctxMenuY">
    <button (click)="ctxDuplicateTarget()"><i class="fa-regular fa-copy"></i> Dupliquer</button>
    <button (click)="ctxCenterTarget()"><i class="fa-solid fa-crosshairs"></i> Centrer sur ce nœud</button>
    <button (click)="ctxOpenAdvancedAndInspector()"><i class="fa-regular fa-pen-to-square"></i> Ouvrir l’éditeur +
      Inspector</button>
    <button class="danger" (click)="ctxDeleteTarget()"><i class="fa-regular fa-trash-can"></i> Supprimer</button>
  </div>
  <flow-advanced-editor-dialog *ngIf="advancedOpen && selectedModel" [model]="selectedModel" [flowId]="currentFlowId"
    [disableForChecksum]="hasTemplateMismatch(selectedModel)"
    [ctx]="advancedCtx" [injectedInput]="advancedInjectedInput" [injectedOutput]="advancedInjectedOutput"
    [hasPrev]="hasPredecessor(selectedModel?.id)" [loadingInput]="previewLoading" [loadingOutput]="outputLoading"
    [testStatus]="testStatus" [testStartedAt]="testStartedAt" [testDurationMs]="testDurationMs" [testDisabled]="isTestDisabled()" [attemptEvents]="advancedAttemptEvents"
    [attemptOptions]="advancedAttemptOptions" [selectedAttemptIdx]="advancedSelectedAttemptIdx"
    (selectedAttemptIdxChange)="onDialogAttemptIdxChange($event)"
    (injectedInputChange)="onDialogInputChange($event)"
    (requestUpdateArgs)="onRequestUpdateArgs()" (test)="onTestSelectedNode()" (runPrev)="onRunPrevNodes()" (startPayloadChange)="onStartPayloadChange($event)"
    (modelChange)="onAdvancedModelChange($event)" (modelChangeCommitted)="onAdvancedModelCommitted($event)"
    (close)="closeAdvancedEditor()"></flow-advanced-editor-dialog>

  <!-- Floating AI Chat Popover Trigger + persistent popover -->
  <button nz-button nzType="primary" class="ai-chat-fab" (click)="aiChatOpen = !aiChatOpen" aria-label="Ouvrir l'assistant IA">
    <i class="fa-solid fa-message"></i>
  </button>
  <div class="ai-chat-backdrop" [class.open]="aiChatOpen" (click)="aiChatOpen=false"></div>
  <div class="ai-chat-popover" [class.open]="aiChatOpen" (click)="$event.stopPropagation()">
    <flow-ai-chat [seedGraph]="{ nodes: nodes, edges: edges }" (close)="aiChatOpen=false" (graphGenerated)="applyAiGraph($event)"></flow-ai-chat>
  </div>

</div>

<!-- Responsive drawers (mobile/tablet) -->
<nz-drawer [nzVisible]="leftDrawer" (nzOnClose)="onLeftDrawerClose()" nzPlacement="left" [nzWidth]="360"
  [nzBodyStyle]="{padding:'0'}" [nzClosable]="false" [nzMaskClosable]="true" nzWrapClassName="ios-safe-drawer">
  <ng-container *nzDrawerContent>
    <ng-container [ngTemplateOutlet]="leftPanelContent" [ngTemplateOutletContext]="{ mode: 'drawer' }"></ng-container>
  </ng-container>
</nz-drawer>

<nz-drawer [nzVisible]="rightDrawer" (nzOnClose)="onRightDrawerClose()" nzPlacement="right" [nzWidth]="360"
  [nzBodyStyle]="{padding:'0'}" [nzClosable]="false" [nzMaskClosable]="true" nzWrapClassName="ios-safe-drawer">
  <ng-container *nzDrawerContent>
    <flow-right-panel [mode]="'drawer'"
      [selected]="selectedNode" [selectedList]="selectionList" [selectedModel]="selectedModel"
      [nodeHasError]="selectedNode?.id ? (isNodeHardError(selectedNode.id) || isNodeInError(selectedNode.id)) : false"
      [nodeErrorText]="selectedNode?.id ? nodeErrorTooltip(selectedNode.id) : null"
      [selectedAttempt]="getLastAttemptFor(selectedNode?.id)"
      [inspectorTab]="inspectorTab" (inspectorTabChange)="inspectorTab = $event" [editJson]="editJson"
      (editJsonChange)="editJson = $event" (openAdvanced)="openAdvancedEditor()" (delete)="deleteSelected()" (openSingle)="onInspectorOpenSingle($event)" (deleteMany)="onDeleteMany()" (saveJson)="saveSelectedJson()"
      [currentFlowName]="currentFlowName" [currentFlowDesc]="currentFlowDesc" [currentFlowStatus]="currentFlowStatus" [currentFlowEnabled]="currentFlowEnabled"
      [builderMode]="builderMode" [lastRun]="lastRun" [currentRun]="currentRun" [canSave]="canSave"
      [runInfo]="currentRunMeta" [selectedRunId]="currentRunMeta?.id || backendRunId" [recentRuns]="recentRuns" [runsHasMore]="runsHasMore" (run)="runFlow()" (stop)="stopLastRun()" (save)="saveFlow()" (metaChange)="onMetaChange()" (clearRun)="onClearRun()" (restart)="onRestartRun()" (selectRun)="onSelectRun($event)" (loadMoreRuns)="onLoadMoreRuns()"
      [timelinePastItems]="timelinePastItemsCache" [timelineFutureItems]="timelineFutureItemsCache"
      (hoverPast)="onHistoryHoverPast($event)" (hoverFuture)="onHistoryHoverFuture($event)" (leave)="onHistoryHoverLeave()" (clickPast)="onHistoryClickPast($event)" (clickFuture)="onHistoryClickFuture($event)"
    ></flow-right-panel>
  </ng-container>
</nz-drawer>
