# Valeurs par défaut — override par environnement via -f values-<env>.yaml

# Namespace (créé par Rancher en général)
namespace:
  create: false
  name: homeport

image:
  repository: registry.example.com/homeport-api
  tag: "latest"
  pullPolicy: IfNotPresent
  pullSecrets: []

api:
  replicas: 2
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2000m"
      memory: "2Gi"
  service:
    type: ClusterIP
    port: 80
  strategy:
    type: RollingUpdate
    maxUnavailable: 0
    maxSurge: 1

aiWorker:
  replicas: 2
  command: ["node", "src/ai/jobs/worker-process.js"]
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "4000m"
      memory: "4Gi"

redis:
  enabled: true
  image: redis:7-alpine
  persistence:
    size: 5Gi
    storageClass: longhorn

# Cache agent — RWX Longhorn obligatoire pour partage API/workers
agentCache:
  size: 50Gi
  storageClass: longhorn
  accessMode: ReadWriteMany

# Env non-sensibles (ConfigMap)
config:
  AI_PROVIDER: "anthropic"
  AI_MODEL: "claude-sonnet-4-5"
  WEB_SEARCH_ENGINE: "duckduckgo"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  HTTP_REQUEST_TIMEOUT: "60000"
  HTTP_BODY_LIMIT: "25mb"
  SOCKET_IO_PATH: "/socket.io"
  CORS_ORIGIN: "*"
  FEATURE_AI_FULLPAGE: "1"
  FEATURE_AI_COMPACT_TRANSFER: "1"

# Variables d'env spécifiques à l'IA injectées dans API + worker
aiEnv:
  AGENT_USE_QUEUE: "1"
  AI_SANDBOX_BACKEND: "bwrap"
  AI_CACHE_ROOT: "/var/lib/homeport/agent-cache"
  AI_CACHE_TTL_IDLE_DEFAULT: "86400"
  AI_CACHE_MAX_SIZE_PER_THREAD: "1073741824"
  AI_CACHE_MAX_SIZE_GLOBAL: "107374182400"
  AI_CACHE_CLEANUP_CRON: "*/15 * * * *"
  AI_MAX_CONCURRENT_SANDBOX: "5"
  AI_MAX_CONCURRENT_SUBAGENTS: "10"
  AI_MAX_SUBAGENT_DEPTH: "3"
  PLUGIN_IMPORT_ENABLED: "1"

# Secrets — toujours remplir via Rancher/sealed-secrets, jamais en clair ici.
# Si `existingSecret` est défini, on skip la création et on utilise ce secret existant.
secrets:
  existingSecret: ""
  # Utilisé uniquement si existingSecret est vide (DEV uniquement)
  values:
    MONGODB_URI: ""
    ANTHROPIC_API_KEY: ""
    OPENAI_API_KEY: ""
    JWT_SECRET: ""
    SESSION_SECRET: ""
    REDIS_PASSWORD: ""

networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx
  # CIDR MongoDB externe (si applicable)
  mongoCidr: "10.0.0.0/8"

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

probes:
  readiness:
    path: /api/health
    initialDelaySeconds: 10
    periodSeconds: 10
  liveness:
    path: /api/health
    initialDelaySeconds: 30
    periodSeconds: 20

podDisruptionBudget:
  enabled: true
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}
