apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: homeport-dev

resources:
  - ../../base

images:
  - name: registry.example.com/homeport-api
    newName: registry.example.com/homeport-api
    newTag: "dev"

patches:
  - path: patch-replicas.yaml
    target:
      kind: Deployment
      name: homeport-api
  - path: patch-worker-replicas.yaml
    target:
      kind: Deployment
      name: homeport-ai-worker
  - path: patch-resources.yaml
    target:
      kind: Deployment
      name: homeport-api
  - path: patch-configmap.yaml
    target:
      kind: ConfigMap
      name: homeport-config

commonLabels:
  env: dev
