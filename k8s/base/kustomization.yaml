apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Labels communs à toutes les ressources
commonLabels:
  app.kubernetes.io/part-of: homeport
  app.kubernetes.io/managed-by: kustomize

resources:
  - namespace.yaml
  - configmap-env.yaml
  - secret-template.yaml
  - pvc-agent-cache.yaml
  - pvc-redis.yaml
  - deployment-redis.yaml
  - service-redis.yaml
  - deployment-api.yaml
  - deployment-ai-worker.yaml
  - service-api.yaml
  - networkpolicy-api.yaml

# Image pointée par défaut — overridable par overlay
images:
  - name: registry.example.com/homeport-api
    newTag: latest
