apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agent-cache
  labels:
    app: homeport-api
    component: storage
spec:
  # RWX requis : partage entre API + workers + sandbox
  accessModes:
    - ReadWriteMany
  storageClassName: longhorn
  resources:
    requests:
      storage: 50Gi
