# Template — NE PAS committer avec des valeurs réelles.
# Remplir via Rancher Secret Manager, sealed-secrets, ou external-secrets.
#
# Génération locale pour dev :
#   kubectl create secret generic homeport-secrets \
#     --from-literal=MONGODB_URI='mongodb://user:pass@mongo:27017/homeport' \
#     --from-literal=ANTHROPIC_API_KEY='sk-ant-...' \
#     --from-literal=OPENAI_API_KEY='sk-...' \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=SESSION_SECRET="$(openssl rand -hex 32)" \
#     -n homeport-<client> --dry-run=client -o yaml > secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: homeport-secrets
  labels:
    app: homeport-api
    component: secrets
type: Opaque
stringData:
  # URI MongoDB (externe recommandé, ou StatefulSet séparé)
  MONGODB_URI: "REPLACE_ME"
  # LLM providers
  ANTHROPIC_API_KEY: "REPLACE_ME"
  OPENAI_API_KEY: "REPLACE_ME"
  # Authentification
  JWT_SECRET: "REPLACE_ME"
  SESSION_SECRET: "REPLACE_ME"
  # Redis (si auth activée — sinon chaîne vide)
  REDIS_PASSWORD: ""
  # Stockage fichiers — si S3/MinIO utilisé
  S3_ACCESS_KEY: ""
  S3_SECRET_KEY: ""
