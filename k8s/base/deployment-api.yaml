apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeport-api
  labels:
    app: homeport-api
    component: api
    tier: backend
    version: v2
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: homeport-api
  template:
    metadata:
      labels:
        app: homeport-api
        component: api
        tier: backend
        version: v2
    spec:
      # Spreader les replicas sur des nodes différents quand possible
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: homeport-api
      containers:
        - name: api
          # Image à override via Kustomize (overlays) ou Helm (values).
          image: registry.example.com/homeport-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - { name: NODE_ENV, value: "production" }
            - { name: PORT, value: "3000" }
            # Active la queue bee-queue pour la reprise de jobs IA
            - { name: AGENT_USE_QUEUE, value: "1" }
            # Sandbox locale bubblewrap (userns non-privilégié requis sur les nodes)
            - { name: AI_SANDBOX_BACKEND, value: "bwrap" }
            - { name: AI_CACHE_ROOT, value: "/var/lib/homeport/agent-cache" }
            - { name: AI_CACHE_TTL_IDLE_DEFAULT, value: "86400" }
            - { name: AI_CACHE_MAX_SIZE_PER_THREAD, value: "1073741824" }
            - { name: AI_CACHE_MAX_SIZE_GLOBAL, value: "107374182400" }
            - { name: AI_CACHE_CLEANUP_CRON, value: "*/15 * * * *" }
            - { name: AI_MAX_CONCURRENT_SANDBOX, value: "5" }
            - { name: AI_MAX_CONCURRENT_SUBAGENTS, value: "10" }
            - { name: AI_MAX_SUBAGENT_DEPTH, value: "3" }
            - { name: REDIS_HOST, value: "redis" }
            - { name: REDIS_PORT, value: "6379" }
            - { name: PLUGIN_IMPORT_ENABLED, value: "1" }
          envFrom:
            - secretRef:
                name: homeport-secrets
            - configMapRef:
                name: homeport-config
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
            # readOnlyRootFilesystem pas activé : bubblewrap a besoin d'écrire dans /tmp
            readOnlyRootFilesystem: false
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          volumeMounts:
            - name: agent-cache
              mountPath: /var/lib/homeport/agent-cache
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: agent-cache
          persistentVolumeClaim:
            claimName: agent-cache
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
