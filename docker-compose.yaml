services:
  api:
    image: kinn-backend:${CI_COMMIT_REF_SLUG}
    container_name: kinn-backend
    volumes:
      - ./API/uploads:/app/uploads
      # Persistance des packages installés dynamiquement via install_package.
      # Sans ce volume, chaque redémarrage perd les libs installées par l'agent
      # (python-docx, openpyxl, etc. via --target → survit aux restarts).
      - sandbox_pkgs:/data/sandbox-pkgs
    environment:
      - PORT=${PORT}
      - NODE_ENV=development
      - HMAC_SECRET=${HMAC_SECRET}
      - TOKEN_TTL_SEC=${TOKEN_TTL_SEC}
      - ENC_KEY=${ENC_KEY}
      - MONGO_URL=${MONGO_URL}
      - MONGO_DB_NAME=${MONGO_DB_NAME}
      - SEED=${SEED}
      - SEED_COMPANIES=${SEED_COMPANIES}
      - SEED_COMPANY_ZITADEL_ORG_ID=${SEED_COMPANY_ZITADEL_ORG_ID:-}
      - SEED_DEMO_USERS=${SEED_DEMO_USERS:-1}
      - LOCAL_SERVICE_TOKEN_ENABLED=${LOCAL_SERVICE_TOKEN_ENABLED:-1}
      - DEFAULT_COMPANY=${DEFAULT_COMPANY}
      - DEFAULT_ADMIN_EMAIL=${DEFAULT_ADMIN_EMAIL}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD}
      - DEFAULT_WORKSPACE_NAME=${DEFAULT_WORKSPACE_NAME}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL}
      - PLUGIN_IMPORT_ENABLED=1
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - SSRF_ALLOW_PRIVATE=1
      - HOST=0.0.0.0
      # ── Sandbox d'exécution de code ────────────────────────────
      # auto = bwrap si userns autorisé par l'hôte, sinon fallback subprocess.
      # Sur K8s managé (userns bloqué), force "subprocess" avec isolation dégradée.
      - AI_SANDBOX_BACKEND=${AI_SANDBOX_BACKEND:-auto}
      - AI_SANDBOX_PYTHON=/usr/bin/python3
      - AI_SANDBOX_NODE=/usr/bin/node
      - AI_SANDBOX_NPM=/usr/bin/npm
      # Shared site-packages (install_package --target + PYTHONPATH) → persistés
      # sur volume `sandbox_pkgs` pour survivre aux redémarrages.
      - AI_SANDBOX_PY_SITE_PACKAGES=/data/sandbox-pkgs/python
      - AI_SANDBOX_NODE_MODULES=/data/sandbox-pkgs/node
      - SKILLS_BUNDLE_DIR=/app/skills-bundle
      # Stream LLM : Opus 4.7 peut pauser 120-180s durant extended thinking.
      - AI_STREAM_TIMEOUT_MS=${AI_STREAM_TIMEOUT_MS:-240000}
      # Install_package policy
      - AI_PACKAGE_INSTALL_MODE=${AI_PACKAGE_INSTALL_MODE:-ask}
      - AI_PACKAGE_INSTALL_MAX_PER_DAY=${AI_PACKAGE_INSTALL_MAX_PER_DAY:-20}
      # ── URLs publiques (HTTP trigger + SSO callback) ─────────────
      - KINN_PUBLIC_URL=${KINN_PUBLIC_URL:-}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-}
      # ── HTTP Trigger ─────────────────────────────────────────────
      - HTTP_TRIGGER_RATE_LIMIT_PER_MIN=${HTTP_TRIGGER_RATE_LIMIT_PER_MIN:-120}
      # ── SSO Zitadel (laisser vide pour désactiver) ───────────────
      - SSO_MODE=${SSO_MODE:-disabled}
      - ZITADEL_ISSUER=${ZITADEL_ISSUER:-}
      - ZITADEL_CLIENT_ID=${ZITADEL_CLIENT_ID:-}
      - ZITADEL_CLIENT_SECRET=${ZITADEL_CLIENT_SECRET:-}
      - ZITADEL_PROJECT_ID=${ZITADEL_PROJECT_ID:-}
      - ZITADEL_REDIRECT_URI=${ZITADEL_REDIRECT_URI:-}
      - ZITADEL_POST_LOGOUT_URI=${ZITADEL_POST_LOGOUT_URI:-}
      - KINN_PANEL_HMAC_SECRET=${KINN_PANEL_HMAC_SECRET:-}
      - SSO_ROLE_MAP=${SSO_ROLE_MAP:-}
      # ── OAuth Bouncer (concentrateur auth.kinn.fr) ──
      # Clé HS256 PARTAGÉE avec le panel + toute la flotte (même valeur partout).
      - KINN_OAUTH_RELAY_SECRET=${KINN_OAUTH_RELAY_SECRET:-}
      - KINN_OAUTH_CONCENTRATOR_URL=${KINN_OAUTH_CONCENTRATOR_URL:-https://auth.kinn.fr}
      # Identifiants OAuth par vendor (1 app enregistrée par vendor chez le provider).
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET:-}
      - MICROSOFT_OAUTH_CLIENT_ID=${MICROSOFT_OAUTH_CLIENT_ID:-}
      - MICROSOFT_OAUTH_CLIENT_SECRET=${MICROSOFT_OAUTH_CLIENT_SECRET:-}
      - META_OAUTH_CLIENT_ID=${META_OAUTH_CLIENT_ID:-}
      - META_OAUTH_CLIENT_SECRET=${META_OAUTH_CLIENT_SECRET:-}
      # TikTok utilise client_key (et non client_id).
      - TIKTOK_OAUTH_CLIENT_KEY=${TIKTOK_OAUTH_CLIENT_KEY:-}
      - TIKTOK_OAUTH_CLIENT_SECRET=${TIKTOK_OAUTH_CLIENT_SECRET:-}
    # ── Capabilities pour bwrap user namespaces ──────────────────
    # Sur Docker Engine moderne (rootless ou classic), bwrap nécessite seccomp
    # permissif. En K8s sans privileged, retirer ces deux options et passer
    # AI_SANDBOX_BACKEND=subprocess.
    security_opt:
      - seccomp:unconfined
    labels:
      - "traefik.http.routers.kinn-backend.rule=Host(`kinn.c4rbon.group`) && (PathPrefix(`/api`) || PathPrefix(`/auth`)) && !PathPrefix(`/onlyoffice`)"
      - "traefik.http.routers.kinn-backend.priority=20"
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-web"
      - "traefik.http.services.kinn-backend.loadbalancer.server.port=5055"
      - "traefik.http.routers.kinn-backend.tls=true"
      - "traefik.http.routers.kinn-backend.entrypoints=websecure,web"
      - "traefik.http.routers.kinn-backend.tls.certresolver=myresolver"
    restart: always
    networks:
      - traefik-web

  homeport:
    container_name: kinn_homeport
    image: kinn_homeport:${CI_COMMIT_REF_SLUG}
    restart: always
    labels:
      - "traefik.http.routers.kinn-homeport.rule=Host(`kinn.c4rbon.group`)  && PathPrefix(`/`) && !PathPrefix(`/api`) && !PathPrefix(`/auth`)"
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-web"
      - "traefik.http.services.kinn-homeport.loadbalancer.server.port=80"
      - "traefik.http.routers.kinn-homeport.tls=true"
      - "traefik.http.routers.kinn-homeport.entrypoints=websecure,web"
      - "traefik.http.routers.kinn-homeport.tls.certresolver=myresolver"
    depends_on:
      - api
    networks:
      - traefik-web

volumes:
  sandbox_pkgs:
    # Packages Python/Node installés dynamiquement par l'agent via install_package.
    # Persiste entre redémarrages pour éviter de réinstaller à chaque restart.

networks:
  traefik-web:
    driver: bridge
    external: true
