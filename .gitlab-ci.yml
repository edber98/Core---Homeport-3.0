stages:
  - build
  - deploy

variables:
  BACK_IMAGE: kinn-backend:$CI_COMMIT_REF_SLUG
  FRONT_IMAGE: kinn_homeport:$CI_COMMIT_REF_SLUG
  BACK_FILE: kinn-backend.tar
  FRONT_FILE: kinn_homeport.tar
  GIT_CLEAN_FLAGS: -ffdx -e API/uploads/ -e API/logs/ -e mongo -e letsencrypt
  # Variables globales pour le pipeline "-2" (deploy_production/kinn)
  BACK_IMAGE_2: kinn-backend-2:$CI_COMMIT_REF_SLUG
  FRONT_IMAGE_2: kinn_homeport-2:$CI_COMMIT_REF_SLUG
  BACK_FILE_2: kinn-backend-2.tar
  FRONT_FILE_2: kinn_homeport-2.tar
  COMPOSE_FILE_2: docker-compose-2.yaml

build:
  stage: build
  tags: 
    - c4rbon_runner
  before_script:
    - sh ./scripts/docker-delete.sh kinn_homeport kinn_homeport
    - sh ./scripts/docker-delete.sh kinn-backend kinn-backend
  script:
    - echo "🚀 Construction du backend"
    - docker build -t $BACK_IMAGE -f API/Dockerfile .
    - docker save $BACK_IMAGE -o $BACK_FILE

    - echo "🚀 Construction du homeport"
    - docker build -t $FRONT_IMAGE -f Homeport/Dockerfile .
    - docker save $FRONT_IMAGE -o $FRONT_FILE
  artifacts:
    paths:
      - $BACK_FILE
      - $FRONT_FILE
  only: 
    - production

deploy:
  stage: deploy
  tags: 
    - c4rbon_runner
  script:
    - echo "📦 Chargement des images Docker"
    - docker load -i $BACK_FILE
    - docker load -i $FRONT_FILE

    - echo "🚀 Déploiement avec Docker Compose"
    - docker compose --file docker-compose.yaml up -d
  only:
    - production

# Build et déploiement pour l'environnement "deploy_production/kinn" avec images et compose "-2"
build_kinn:
  stage: build
  tags:
    - c4rbon_runner
  before_script:
    - sh ./scripts/docker-delete.sh kinn_homeport-2 kinn_homeport-2
    - sh ./scripts/docker-delete.sh kinn-backend-2 kinn-backend-2
  script:
    - echo "🚀 Construction du backend (kinn -2)"
    - docker build -t $BACK_IMAGE_2 -f API/Dockerfile .
    - docker save $BACK_IMAGE_2 -o $BACK_FILE_2

    - echo "🚀 Construction du homeport (kinn -2)"
    - docker build -t $FRONT_IMAGE_2 -f Homeport/Dockerfile .
    - docker save $FRONT_IMAGE_2 -o $FRONT_FILE_2
  artifacts:
    paths:
      - $BACK_FILE_2
      - $FRONT_FILE_2
  only:
    - deploy_production/kinn

deploy_kinn:
  stage: deploy
  tags:
    - c4rbon_runner
  script:
    - echo "📦 Chargement des images Docker (kinn -2)"
    - docker load -i $BACK_FILE_2
    - docker load -i $FRONT_FILE_2

    - echo "🚀 Déploiement avec Docker Compose (kinn -2)"
    - docker compose --file $COMPOSE_FILE_2 up -d
  only:
    - deploy_production/kinn

# ──────────────────────────────────────────────────────────────────────────
# Build & push des images dans le registry GitLab interne, déclenché par un
# tag `v*` (ex: v0.0.34). Permet à Rancher (kinn_manifest Helm chart) de pull
# une version stable et reproductible.
#
# Variables CI/CD natives utilisées (rien à configurer) :
#   $CI_REGISTRY            = registry.c4rbon.group
#   $CI_REGISTRY_USER       = gitlab-ci-token
#   $CI_REGISTRY_PASSWORD   = job-token éphémère
#   $CI_REGISTRY_IMAGE      = registry.c4rbon.group/edouard.bernier/kinn-homeport
#   $CI_COMMIT_TAG          = ex: v0.0.34
#
# Déclenchement : `git push gitlab v0.0.34` après avoir taggé.
# Ne tourne PAS sur les branches → aucun impact sur les pipelines existants.
# ──────────────────────────────────────────────────────────────────────────
build_release:
  stage: build
  tags:
    - c4rbon_runner
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  before_script:
    - echo "🔐 Login registry $CI_REGISTRY"
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - echo "🚀 Build api:$CI_COMMIT_TAG"
    - docker build -t "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_TAG" -t "$CI_REGISTRY_IMAGE/api:latest" -f API/Dockerfile .
    - echo "🚀 Build web:$CI_COMMIT_TAG"
    - docker build -t "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_TAG" -t "$CI_REGISTRY_IMAGE/web:latest" -f Homeport/Dockerfile .
    - echo "📤 Push api:$CI_COMMIT_TAG + :latest"
    - docker push "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_TAG"
    - docker push "$CI_REGISTRY_IMAGE/api:latest"
    - echo "📤 Push web:$CI_COMMIT_TAG + :latest"
    - docker push "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_TAG"
    - docker push "$CI_REGISTRY_IMAGE/web:latest"
    - echo "✅ Release $CI_COMMIT_TAG publiée dans le registry"
  after_script:
    - docker logout "$CI_REGISTRY" || true
