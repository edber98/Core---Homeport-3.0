services:
  api:
    image: kinn-backend-2:${CI_COMMIT_REF_SLUG}
    container_name: kinn-backend-2
    volumes:
      - ./API:/app
      - ./API/mongo-data:/mongo-data
      - ./API/redis-data:/redis-data
    environment:
      - PORT=${PORT}
      - NODE_ENV=development
      - HMAC_SECRET=${HMAC_SECRET}
      - TOKEN_TTL_SEC=${TOKEN_TTL_SEC}
      - ENC_KEY=${ENC_KEY}
      - MONGO_URL=${MONGO_URL}
      - MONGO_DB_NAME=kinn_2_production
      - SEED=${SEED}
      - SEED_COMPANIES=${SEED_COMPANIES}
      - DEFAULT_COMPANY=${DEFAULT_COMPANY}
      - DEFAULT_ADMIN_EMAIL=${DEFAULT_ADMIN_EMAIL}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD}
      - DEFAULT_WORKSPACE_NAME=${DEFAULT_WORKSPACE_NAME}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL}
      - HOST=0.0.0.0
      - PLUGIN_IMPORT_ENABLED=1
      # ── Provider IA + IA locale (vLLM / Ollama / LM Studio) ──
      - AI_PROVIDER=${AI_PROVIDER:-}
      - AI_BASE_URL=${AI_BASE_URL:-}
      - VLLM_BASE_URL=${VLLM_BASE_URL:-}
      - VLLM_MODEL=${VLLM_MODEL:-}
      - AI_MODEL_VLLM=${AI_MODEL_VLLM:-}
      - VLLM_API_KEY=${VLLM_API_KEY:-local}
      - VLLM_MAX_TOKENS=${VLLM_MAX_TOKENS:-0}
      - AI_FORCE_CHAT_COMPLETIONS=${AI_FORCE_CHAT_COMPLETIONS:-0}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-}
      # ── Mini-LLM + outils web ──
      - WEB_MINI_PROVIDER=${WEB_MINI_PROVIDER:-}
      - WEB_MINI_MODEL=${WEB_MINI_MODEL:-}
      - WEB_MINI_BASE_URL=${WEB_MINI_BASE_URL:-}
      - WEB_MINI_API_KEY=${WEB_MINI_API_KEY:-}
      # ── Redis (optionnel) ──
      - REDIS_HOST=${REDIS_HOST:-}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      # ── File storage ──
      - FILE_STORAGE_TYPE=${FILE_STORAGE_TYPE:-local}
      - FILE_STORAGE_PATH=${FILE_STORAGE_PATH:-./data/files}
      # ── OAuth Bouncer (concentrateur auth.kinn.fr) ──
      - KINN_OAUTH_RELAY_SECRET=${KINN_OAUTH_RELAY_SECRET:-}
      - KINN_OAUTH_CONCENTRATOR_URL=${KINN_OAUTH_CONCENTRATOR_URL:-https://auth.kinn.fr}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET:-}
      - MICROSOFT_OAUTH_CLIENT_ID=${MICROSOFT_OAUTH_CLIENT_ID:-}
      - MICROSOFT_OAUTH_CLIENT_SECRET=${MICROSOFT_OAUTH_CLIENT_SECRET:-}
      - META_OAUTH_CLIENT_ID=${META_OAUTH_CLIENT_ID:-}
      - META_OAUTH_CLIENT_SECRET=${META_OAUTH_CLIENT_SECRET:-}
      - TIKTOK_OAUTH_CLIENT_KEY=${TIKTOK_OAUTH_CLIENT_KEY:-}
      - TIKTOK_OAUTH_CLIENT_SECRET=${TIKTOK_OAUTH_CLIENT_SECRET:-}
    labels:
      - "traefik.http.routers.kinn-backend-2.rule=Host(`app.kinn.fr`) && (PathPrefix(`/api`) || PathPrefix(`/auth`)) && !PathPrefix(`/onlyoffice`)"
      - "traefik.http.routers.kinn-backend-2.priority=20"
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-web"
      - "traefik.http.services.kinn-backend-2.loadbalancer.server.port=5055"
      - "traefik.http.routers.kinn-backend-2.tls=true"
      - "traefik.http.routers.kinn-backend-2.entrypoints=websecure,web"
      - "traefik.http.routers.kinn-backend-2.tls.certresolver=myresolver"
    restart: always
    networks:
      - traefik-web
  
  homeport:
    container_name: kinn_homeport-2
    image: kinn_homeport-2:${CI_COMMIT_REF_SLUG}
    restart: always
    labels:
      - "traefik.http.routers.kinn-homeport-2.rule=Host(`app.kinn.fr`)  && PathPrefix(`/`) && !PathPrefix(`/api`) && !PathPrefix(`/auth`)"
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-web"
      - "traefik.http.services.kinn-homeport-2.loadbalancer.server.port=80"
      - "traefik.http.routers.kinn-homeport-2.tls=true"
      - "traefik.http.routers.kinn-homeport-2.entrypoints=websecure,web"
      - "traefik.http.routers.kinn-homeport-2.tls.certresolver=myresolver"

    depends_on:
      - api
    networks:
      - traefik-web



networks:
  traefik-web:
    driver: bridge
    external: true
